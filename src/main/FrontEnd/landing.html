<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rockstar Nexus | Premium Game Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --accent: #FFAB00;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- Animations --- */
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(255, 171, 0, 0.6); }
            50% { text-shadow: 0 0 45px rgba(255, 171, 0, 0.9); }
            100% { text-shadow: 0 0 20px rgba(255, 171, 0, 0.6); }
        }

        .reveal { opacity: 0; transform: translateY(50px); transition: all 1s ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* --- Navigation --- */
        nav {
            display: flex; justify-content: space-between; align-items: center; padding: 10px 5%;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); position: fixed;
            width: 100%; top: 0; z-index: 1000; height: 60px; border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--accent); letter-spacing: 2px; }
        .nav-links { display: flex; gap: 25px; list-style: none; }
        .nav-links a { text-decoration: none; color: #eee; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; transition: 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* --- Hero --- */
        .hero {
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), var(--bg)),
            url('Assests/Jason_and_Lucia_01_With_Logos_landscape.webp');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        .hero h1 { font-family: 'Bebas Neue', sans-serif; font-size: 8rem; color: var(--accent); animation: titleGlow 3s infinite ease-in-out; }

        .btn-gallery {
            padding: 15px 45px; background: var(--accent); color: #000;
            text-decoration: none; font-family: 'Bebas Neue'; font-size: 1.6rem;
            letter-spacing: 2px; display: inline-block; margin-top: 20px; border-radius: 2px;
        }

        /* --- Sections --- */
        .video-section { width: 100%; height: 70vh; background: #000; overflow: hidden; border-top: 1px solid var(--border); }
        .video-section video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

        .container { max-width: 1400px; margin: 0 auto; padding: 80px 20px; }
        .gallery-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }

        .preview-card { background: #0a0a0a; border: 1px solid var(--border); pointer-events: none; }
        .preview-card img { width: 100%; height: 400px; object-fit: cover; }
        .info { padding: 20px; border-top: 2px solid var(--accent); text-align: center; }

        footer { text-align: center; padding: 60px; color: #444; border-top: 1px solid #111; font-size: 0.8rem; letter-spacing: 3px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">ROCKSTAR NEXUS</div>
    <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="gallery.html">Gallery</a></li> <li><a href="Customer.html">Store</a></li>
        <li><a href="#sell">Sell</a></li>
    </ul>
</nav>

<header class="hero">
    <div class="reveal active">
        <p style="letter-spacing: 8px;">UNDERGROUND ACCESS</p>
        <h1>ULTIMATE GAMING</h1>
        <a href="gallery.html" class="btn-gallery">Watch Gallery</a>
    </div>
</header>

<section class="video-section">
    <video autoplay muted loop playsinline><source src="Assests/Grand%20Theft%20Auto%20VI%20.mp4" type="video/mp4"></video>
</section>

<div class="container">
    <h2 style="font-family:'Bebas Neue'; font-size: 3.5rem; text-align: center; margin-bottom: 40px;">Featured Stock</h2>
    <div class="gallery-preview">
        <div class="preview-card">
            <img src="Assests/gta v.png" alt="GTA V">
            <div class="info"><h3 style="font-family:'Bebas Neue'; font-size:1.8rem;">Grand Theft Auto V</h3></div>
        </div>
        <div class="preview-card">
            <img src="Assests/rdr 2.png" alt="RDR 2">
            <div class="info"><h3 style="font-family:'Bebas Neue'; font-size:1.8rem;">Red Dead Redemption 2</h3></div>
        </div>
    </div>
</div>

<footer>&copy; 2026 ROCKSTAR NEXUS | ELITE ARCHIVE</footer>

</body>
</html>
