<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rockstar Nexus | Premium Game Store</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --bg: #050505;
            --card-bg: #111111;
            --text: #ffffff;
            --accent: #FFAB00;
            --border: #222;
            --hover-glow: rgba(255, 171, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- Animations --- */
        @keyframes titleGlow {
            0% { text-shadow: 0 0 20px rgba(255, 171, 0, 0.6); }
            50% { text-shadow: 0 0 45px rgba(255, 171, 0, 0.9); }
            100% { text-shadow: 0 0 20px rgba(255, 171, 0, 0.6); }
        }

        .reveal {
            opacity: 0;
            transform: translateY(50px);
            transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            background: transparent;
            backdrop-filter: none;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 60px;
            border-bottom: 1px solid transparent;
            transition: background 0.4s ease,
            border-color 0.4s ease,
            backdrop-filter 0.4s ease;
        }

        nav.scrolled {
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a {
            text-decoration: none;
            color: #eee;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }

        .nav-links a.active {
            color: var(--accent);
            border-bottom: 1px solid var(--accent);
            padding-bottom: 2px;
        }

        /* Profile Icon */
        .profile-icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            text-decoration: none;
            transition: 0.3s;
        }
        .profile-icon-link svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .profile-icon-link:hover {
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px var(--accent));
        }

        /* --- Hero --- */
        .hero-wrapper {
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), var(--bg)),
            url('Assests/Jason_and_Lucia_01_With_Logos_landscape.webp');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            transition: transform 0.1s ease-out;
        }

        .hero h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 10vw, 9rem);
            color: var(--accent);
            line-height: 0.9;
            margin-top: 40px;
            animation: titleGlow 3s infinite ease-in-out;
        }

        .hero p {
            font-size: 1.1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        .btn-main {
            padding: 15px 45px;
            background: var(--accent);
            color: #000;
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            display: inline-block;
            margin-top: 20px;
            border-radius: 2px;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .btn-main:hover {
            background: #ffc233;
            box-shadow: 0 0 30px rgba(255, 171, 0, 0.5);
        }

        /* --- Video Section --- */
        .video-section {
            width: 100%;
            height: 80vh;
            background: #000;
            position: relative;
            overflow: hidden;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .video-section video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        /* --- Search --- */
        .search-outer {
            width: 100%;
            padding: 40px 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
        }
        .search-container {
            width: 90%;
            max-width: 1200px;
        }
        .search-container input {
            width: 100%;
            padding: 25px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: #0a0a0a;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 2px;
            transition: border-color 0.4s, box-shadow 0.4s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            outline: none;
            font-family: 'Barlow', sans-serif;
        }
        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(255, 171, 0, 0.15);
        }
        .search-container input::placeholder { color: #555; }

        /* --- Gallery --- */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px 100px; }
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            margin: 50px 0;
            color: white;
            text-align: center;
            letter-spacing: 2px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .game-card {
            background: #0a0a0a;
            border: 1px solid var(--border);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255, 171, 0, 0.2);
        }
        .game-card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            filter: grayscale(40%);
            transition: filter 0.5s;
        }
        .game-card:hover img { filter: grayscale(0%); }

        .game-info {
            padding: 25px;
            background: #0a0a0a;
            border-top: 2px solid var(--accent);
        }
        .game-info h3 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
            color: #fff;
        }
        .game-info .price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.4rem;
            font-family: 'Bebas Neue';
        }

        /* --- Sell / Add Form --- */
        .add-game-section { padding: 100px 20px; background: #030303; }
        .add-form {
            max-width: 600px;
            margin: 0 auto;
            background: #0a0a0a;
            padding: 50px;
            border-right: 5px solid var(--accent);
        }
        .add-form h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .add-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: #000;
            color: white;
            border: 1px solid #333;
            font-family: 'Barlow', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .add-form input:focus { border-color: var(--accent); }
        .add-form input::placeholder { color: #555; letter-spacing: 1px; }
        .add-form button {
            width: 100%;
            padding: 20px;
            background: var(--accent);
            color: #000;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            border: none;
            cursor: pointer;
            transition: background 0.3s, box-shadow 0.3s;
            letter-spacing: 2px;
        }
        .add-form button:hover {
            background: #ffc233;
            box-shadow: 0 0 30px rgba(255, 171, 0, 0.4);
        }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 60px;
            color: #444;
            border-top: 1px solid #111;
            font-size: 0.8rem;
            letter-spacing: 3px;
        }

        /* --- Mobile --- */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hero h1 { font-size: 4rem; }
        }
    </style>
</head>
<body>

<!-- ===================== NAVIGATION ===================== -->
<nav id="mainNav">
    <a href="landing.html" class="logo">ROCKSTAR NEXUS</a>
    <div class="nav-right">
        <ul class="nav-links">
            <li><a href="landing.html" class="active">Home</a></li>
            <li><a href="Gallery.html">Gallery</a></li>
            <li><a href="Customer.html">Store</a></li>
            <li><a href="community.html">Community</a></li>
            <li><a href="#sell">Sell</a></li>
            <li><a href="Support.html">Support</a></li>
        </ul>
        <a href="login.html" class="profile-icon-link" title="Login / Profile">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </a>
    </div>
</nav>

<!-- ===================== HERO ===================== -->
<div class="hero-wrapper">
    <header class="hero" id="heroImage">
        <div class="reveal" id="heroContent">
            <p>Welcome to the Underground</p>
            <h1>ULTIMATE GAMING</h1>
            <a href="Customer.html" class="btn-main">Browse Store</a>
        </div>
    </header>
</div>

<!-- ===================== VIDEO ===================== -->
<section class="video-section">
    <video autoplay muted loop playsinline>
        <source src="Assests/Grand%20Theft%20Auto%20VI%20.mp4" type="video/mp4">
    </video>
</section>

<!-- ===================== SEARCH ===================== -->
<div class="search-outer">
    <div class="search-container reveal">
        <input type="text" id="searchInput" placeholder="SEARCH FOR A LEGENDARY TITLE..." onkeyup="filterGames()">
    </div>
</div>

<!-- ===================== GAME GALLERY ===================== -->
<div class="container" id="store">
    <h2 class="section-title reveal">Current Stock</h2>
    <section class="gallery" id="gallery"></section>
</div>

<!-- ===================== SELL / ADD FORM ===================== -->
<section class="add-game-section" id="sell">
    <div class="add-form reveal">
        <h2>List Your Title</h2>
        <form id="gameForm">
            <input type="text" id="game_id" placeholder="GAME ID">
            <input type="text" id="title" placeholder="GAME TITLE">
            <button type="submit">Deploy to Store</button>
        </form>
    </div>
</section>

<!-- ===================== FOOTER ===================== -->
<footer>
    &copy; 2026 ROCKSTAR NEXUS | DESIGNED FOR THE ELITE
</footer>

<!-- ===================== SCRIPTS ===================== -->
<script>
    /* ---- Transparent → Dark nav on scroll ---- */
    const mainNav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 10) {
            mainNav.classList.add('scrolled');
        } else {
            mainNav.classList.remove('scrolled');
        }
    });

    /* ---- Scroll Reveal ---- */
    window.addEventListener('scroll', () => {
        document.querySelectorAll('.reveal').forEach(el => {
            if (el.getBoundingClientRect().top < window.innerHeight - 100) {
                el.classList.add('active');
            }
        });
    });

    /* ---- On Load ---- */
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('heroContent').classList.add('active');
        }, 300);
        loadGames();
    };

    /* ---- Static Game Data ---- */
    const rockstarGames = [
        { game_id: "1", title: "Grand Theft Auto V",    price: "Rs 2999.00", imageUrl: "Assests/gta v.png" },
        { game_id: "2", title: "Red Dead Redemption 2", price: "Rs 3999.00", imageUrl: "Assests/rdr 2.png" }
    ];

    function buildCard(game) {
        const div = document.createElement("div");
        div.className = "game-card reveal";
        div.onclick = () => { window.location.href = "Customer.html"; };
        div.innerHTML = `
            <img src="${game.imageUrl}" alt="${game.title}"
                 onerror="this.src='https://placehold.co/400x500/111/444?text=Rockstar'">
            <div class="game-info">
                <h3>${game.title}</h3>
                <span class="price">${game.price}</span>
            </div>`;
        return div;
    }

    function loadGames() { render(rockstarGames); }

    function render(data) {
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";
        data.forEach(g => {
            const card = buildCard(g);
            gallery.appendChild(card);
            setTimeout(() => card.classList.add('active'), 100);
        });
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        render(rockstarGames.filter(g => g.title.toLowerCase().includes(query)));
    }

    /* ---- Prevent default form submit ---- */
    document.getElementById('gameForm').addEventListener('submit', e => {
        e.preventDefault();
        const id    = document.getElementById('game_id').value.trim();
        const title = document.getElementById('title').value.trim();
        if (id && title) {
            alert(`"${title}" has been listed in the store!`);
            document.getElementById('gameForm').reset();
        }
    });
</script>
</body>
</html>
