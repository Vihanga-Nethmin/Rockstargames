<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockstar Nexus | Admin Terminal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

    :root {
      --accent: #FFAB00;
      --bg: #050505;
      --card-bg: #000;
      --border: #222;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: white;
      min-height: 100vh;
    }

    .video-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; object-fit: cover; opacity: 0.15;
    }

    /* ==============================
       LOGIN SCREEN
    ============================== */
    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    .login-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 3.5rem;
      color: var(--accent);
      letter-spacing: 5px;
      text-shadow: 0 0 30px rgba(255,171,0,0.4);
      margin-bottom: 6px;
      text-align: center;
    }

    .login-sub {
      color: #444;
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-align: center;
    }

    .login-card {
      background: #000;
      border: 1px solid #1a1a1a;
      border-top: 4px solid var(--accent);
      padding: 40px;
      width: 100%;
      max-width: 380px;
    }

    .login-card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--accent);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .login-card-sub {
      color: #444;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .login-field { margin-bottom: 14px; }

    .login-field label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .login-field input {
      width: 100%;
      padding: 12px 14px;
      background: #0d0d0d;
      border: 1px solid #222;
      color: white;
      font-size: 0.95rem;
      border-radius: 2px;
      transition: 0.2s;
      box-sizing: border-box;
      font-family: 'Barlow', sans-serif;
    }

    .login-field input:focus { outline: none; border-color: var(--accent); background: #111; }
    .login-field input::placeholder { color: #333; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 2px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.3s;
    }

    .btn-login:hover { background: #fff; }
    .btn-login:disabled { background: #444; color: #888; cursor: not-allowed; }

    .login-error {
      background: #2e0d0d;
      border: 1px solid #7d2e2e;
      color: #f44336;
      padding: 10px 14px;
      margin-top: 12px;
      font-size: 0.82rem;
      text-align: center;
      border-radius: 2px;
      display: none;
    }

    .login-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #444;
    }

    .login-footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .login-footer a:hover { text-decoration: underline; }

    /* ==============================
       ADMIN DASHBOARD
    ============================== */
    #adminDashboard { display: none; padding: 40px 20px; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #1a1a1a;
      max-width: 1100px;
      margin-left: auto;
      margin-right: auto;
    }

    .topbar-logo { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent); letter-spacing: 3px; }

    .topbar-right { display: flex; align-items: center; gap: 20px; }

    .admin-badge { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #555; }
    .admin-badge span { color: var(--accent); font-weight: 700; }

    .btn-logout-top {
      background: transparent;
      border: 1px solid #333;
      color: #888;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 1px;
      padding: 7px 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-logout-top:hover { border-color: #c0392b; color: #c0392b; }

    .container { max-width: 1100px; margin: 0 auto; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 35px; }

    .stat-card {
      background: #000;
      border: 1px solid #1a1a1a;
      border-top: 3px solid var(--accent);
      padding: 20px 24px;
    }

    .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #555; margin-bottom: 8px; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; color: var(--accent); line-height: 1; }

    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: 3px;
      margin-bottom: 20px;
      border-left: 4px solid var(--accent);
      padding-left: 15px;
    }

    .form-section {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 35px;
      border-top: 4px solid var(--accent);
    }

    .form-group { display: flex; flex-direction: column; }

    .form-group label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 5px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .form-group input {
      padding: 11px 14px;
      background: #0d0d0d;
      border: 1px solid #222;
      color: white;
      font-size: 0.95rem;
      border-radius: 2px;
      width: 100%;
      box-sizing: border-box;
      font-family: 'Barlow', sans-serif;
      transition: 0.2s;
    }

    .form-group input:focus { outline: none; border-color: var(--accent); background: #111; }

    .button-row { grid-column: span 2; display: flex; gap: 10px; margin-top: 6px; }

    .btn {
      flex: 1;
      padding: 14px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      cursor: pointer;
      border: none;
      transition: 0.3s;
      letter-spacing: 1px;
    }

    .btn-save   { background: var(--accent); color: #000; }
    .btn-update { background: #2980b9; color: #fff; }
    .btn-delete { background: #c0392b; color: #fff; }
    .btn:hover  { filter: brightness(1.2); transform: translateY(-2px); }

    .search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }

    .search-row input {
      flex: 1;
      padding: 10px 14px;
      background: #0d0d0d;
      border: 1px solid #222;
      color: white;
      font-size: 0.9rem;
      border-radius: 2px;
      font-family: 'Barlow', sans-serif;
    }

    .search-row input:focus { outline: none; border-color: var(--accent); }
    .search-row input::placeholder { color: #333; }

    .btn-refresh {
      padding: 10px 20px;
      background: #111;
      border: 1px solid #333;
      color: var(--accent);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-refresh:hover { background: #1a1a1a; border-color: var(--accent); }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.6); }

    th {
      background: #0a0a0a;
      color: var(--accent);
      font-family: 'Bebas Neue';
      font-size: 1rem;
      padding: 14px 16px;
      text-align: left;
      border-bottom: 2px solid var(--accent);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    td { padding: 12px 16px; border-bottom: 1px solid #111; font-size: 0.88rem; color: #ccc; }
    tr:hover td { background: rgba(255,171,0,0.03); }

    .btn-select {
      background: #111;
      color: var(--accent);
      border: 1px solid #333;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      transition: 0.2s;
    }

    .btn-select:hover { background: var(--accent); color: #000; border-color: var(--accent); }

    .empty-row td { text-align: center; color: #333; padding: 30px; font-style: italic; }
    .loading-row td { text-align: center; padding: 30px; color: #555; }

    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid #333;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast notification ── */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 22px;
      border-radius: 3px;
      font-size: 0.88rem;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
      font-size: 1rem;
      display: none;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }

    #toast.success { background: #0d2e0d; border: 1px solid #2e7d2e; color: #4caf50; }
    #toast.error   { background: #2e0d0d; border: 1px solid #7d2e2e; color: #f44336; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
  <source src="Assests/video.mp4" type="video/mp4">
</video>

<!-- ==============================
     LOGIN SCREEN
============================== -->
<div id="loginScreen">
  <div class="login-logo">ROCKSTAR NEXUS</div>
  <p class="login-sub">Admin Terminal</p>

  <div class="login-card">
    <div class="login-card-title">Admin Access</div>
    <div class="login-card-sub">Authorized personnel only</div>

    <div class="login-field">
      <label>Username</label>
      <input type="text" id="admin_username" placeholder="admin" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="admin_password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn-login" id="loginBtn" onclick="adminLogin()">Initialize Access</button>
    <div class="login-error" id="loginError"></div>

    <div class="login-footer">
      Not an admin? <a href="Customer.html">Go to Customer Portal</a>
    </div>
  </div>
</div>

<!-- ==============================
     ADMIN DASHBOARD
============================== -->
<div id="adminDashboard">
  <div class="topbar">
    <div class="topbar-logo">RS — NEXUS</div>
    <div class="topbar-right">
      <div class="admin-badge">Logged in as <span id="adminName">Admin</span></div>
      <button class="btn-logout-top" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Customers</div>
        <div class="stat-value" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Selected Record</div>
        <div class="stat-value" id="statSelected">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Refreshed</div>
        <div class="stat-value" id="statTime" style="font-size:1.4rem; padding-top:6px;">—</div>
      </div>
    </div>

    <div class="section-title">Manage Customers</div>
    <div class="form-section">
      <div class="form-group">
        <label>Customer ID</label>
        <input type="text" id="cid" placeholder="CUST-001">
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Jason Vercetti">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="jason@nexus.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="form-group" style="grid-column: span 2;">
        <label>Address</label>
        <input type="text" id="address" placeholder="123 Ocean View, Vice City">
      </div>
      <div class="button-row">
        <button class="btn btn-save"   onclick="savecustomer()">Add Customer</button>
        <button class="btn btn-update" onclick="updatecustomer()">Update Data</button>
        <button class="btn btn-delete" onclick="deletecustomer()">Terminate Access</button>
      </div>
    </div>

    <div class="section-title">Customer Database</div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search by name, email or ID..." oninput="filterTable()">
      <button class="btn-refresh" onclick="getAll()">↻ Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>#</th>
          <th>Customer ID</th>
          <th>Full Name</th>
          <th>Email</th>
          <th>Address</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody id="tablerow"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  const AUTH_URL = "http://localhost:8080/api/v1/auth/login";
  const BASE_URL = "http://localhost:8080/api/v1/customer";

  let allCustomers = [];

  // ─── JWT UTILITIES ─────────────────────────────────────────────────────────
  function getTokenPayload() {
    try {
      const token = localStorage.getItem('nexus_token');
      if (!token) return null;
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) { return null; }
  }

  function getRoleFromToken() {
    const p = getTokenPayload();
    if (!p) return '';
    return (p.role || p.roles || p.authorities || '').toString().toUpperCase();
  }

  function getUsernameFromToken() {
    const p = getTokenPayload();
    if (!p) return 'Admin';
    return p.sub || p.username || 'Admin';
  }

  // Inject token into every AJAX request automatically
  $.ajaxSetup({
    beforeSend: function(xhr) {
      const token = localStorage.getItem('nexus_token');
      if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    }
  });

  // ─── PAGE INIT ─────────────────────────────────────────────────────────────
  $(document).ready(function () {
    const token = localStorage.getItem('nexus_token');

    // If already logged in as ADMIN, go straight to dashboard
    if (token && getRoleFromToken().includes('ADMIN')) {
      showDashboard();
    }
    // Otherwise the login screen is visible by default

    // Allow pressing Enter to log in
    $('#admin_username, #admin_password').on('keypress', function(e) {
      if (e.which === 13) adminLogin();
    });
  });

  // ─── ADMIN LOGIN ───────────────────────────────────────────────────────────
  function adminLogin() {
    const username = $('#admin_username').val().trim();
    const password = $('#admin_password').val().trim();

    if (!username || !password) {
      showLoginError('Please enter username and password.');
      return;
    }

    $('#loginBtn').prop('disabled', true).text('Authenticating...');
    $('#loginError').hide();

    $.ajax({
      url: AUTH_URL,
      method: 'POST',
      contentType: 'application/json',
      beforeSend: function(xhr) {
        // ✅ No token on the login request itself
        xhr.setRequestHeader('Authorization', '');
      },
      data: JSON.stringify({ username, password }),
      success: function (res) {
        const token = (res.data && res.data.accessToken) ? res.data.accessToken : res.data;

        if (!token) {
          $('#loginBtn').prop('disabled', false).text('Initialize Access');
          showLoginError('Login failed: No token received.');
          return;
        }

        // ✅ SECURITY: verify ADMIN role from the JWT payload — not from a stored value
        const roleInToken = (() => {
          try {
            const p = JSON.parse(atob(token.split('.')[1]));
            return (p.role || p.roles || p.authorities || '').toString().toUpperCase();
          } catch(e) { return ''; }
        })();

        if (!roleInToken.includes('ADMIN')) {
          $('#loginBtn').prop('disabled', false).text('Initialize Access');
          showLoginError('Access Denied: This account does not have admin privileges.');
          return;
        }

        // Save token and go to dashboard
        localStorage.setItem('nexus_token', token);
        showDashboard();
      },
      error: function (xhr) {
        $('#loginBtn').prop('disabled', false).text('Initialize Access');
        if (xhr.status === 401 || xhr.status === 403) {
          showLoginError('Wrong username or password.');
        } else if (xhr.status === 0) {
          showLoginError('Cannot reach server. Is Spring Boot running on port 8080?');
        } else {
          showLoginError('Error ' + xhr.status + ': ' + (xhr.responseJSON?.message || 'Unknown error.'));
        }
      }
    });
  }

  function showLoginError(msg) {
    $('#loginError').text(msg).show();
  }

  function showDashboard() {
    $('#adminName').text(getUsernameFromToken());
    $('#loginScreen').hide();
    $('#adminDashboard').show();
    getAll();
  }

  // ─── LOAD ALL CUSTOMERS ────────────────────────────────────────────────────
  function getAll() {
    $('#tablerow').html('<tr class="loading-row"><td colspan="6"><span class="spinner"></span> Loading customers...</td></tr>');
    $('#statTime').text('...');

    $.ajax({
      url: BASE_URL + "/all",
      method: 'GET',
      success: function (res) {
        allCustomers = res.data ? res.data : res;
        renderTable(allCustomers);
        $('#statTotal').text(allCustomers.length);
        const now = new Date();
        $('#statTime').text(now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0'));
      },
      error: function (err) { handleAuthError(err); }
    });
  }

  function renderTable(data) {
    $('#tablerow').empty();
    if (!data || data.length === 0) {
      $('#tablerow').html('<tr class="empty-row"><td colspan="6">No customers found in the database.</td></tr>');
      return;
    }
    data.forEach((c, i) => {
      $('#tablerow').append(`<tr>
        <td style="color:#444">${i + 1}</td>
        <td style="color:var(--accent);font-weight:700">${c.customer_id}</td>
        <td>${c.name}</td>
        <td style="color:#888">${c.email}</td>
        <td style="color:#666">${c.address}</td>
        <td><button class="btn-select" onclick="selectCustomer('${c.customer_id}','${c.name}','${c.email}','${c.address}')">Select</button></td>
      </tr>`);
    });
  }

  function filterTable() {
    const q = $('#searchInput').val().toLowerCase();
    if (!q) { renderTable(allCustomers); return; }
    const filtered = allCustomers.filter(c =>
            (c.customer_id || '').toLowerCase().includes(q) ||
            (c.name        || '').toLowerCase().includes(q) ||
            (c.email       || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
  }

  // ─── CRUD OPERATIONS ───────────────────────────────────────────────────────
  function savecustomer() {
    const obj = buildObj();
    if (!obj.customer_id || !obj.name || !obj.email || !obj.password || !obj.address) {
      showToast('All fields are required.', 'error'); return;
    }
    $.ajax({
      url: BASE_URL, method: 'POST', contentType: 'application/json',
      data: JSON.stringify(obj),
      success: function () { showToast('Customer Added!', 'success'); clearFields(); getAll(); },
      error: function (err) { handleAuthError(err); }
    });
  }

  function updatecustomer() {
    const obj = buildObj();
    if (!obj.customer_id) { showToast('Select a customer first.', 'error'); return; }
    $.ajax({
      url: BASE_URL, method: 'PUT', contentType: 'application/json',
      data: JSON.stringify(obj),
      success: function () { showToast('Customer Updated!', 'success'); clearFields(); getAll(); },
      error: function (err) { handleAuthError(err); }
    });
  }

  function deletecustomer() {
    const id = $('#cid').val().trim();
    if (!id) { showToast('Select a customer first.', 'error'); return; }
    if (confirm('Terminate access for ' + id + '?')) {
      $.ajax({
        url: BASE_URL + '/' + id, method: 'DELETE',
        success: function () { showToast('Access Terminated!', 'success'); clearFields(); getAll(); },
        error: function (err) { handleAuthError(err); }
      });
    }
  }

  // ─── UTILITIES ─────────────────────────────────────────────────────────────
  function buildObj() {
    return {
      customer_id: $('#cid').val().trim(),
      name:        $('#name').val().trim(),
      email:       $('#email').val().trim(),
      password:    $('#password').val().trim(),
      address:     $('#address').val().trim()
    };
  }

  function selectCustomer(id, name, email, address) {
    $('#cid').val(id);
    $('#name').val(name);
    $('#email').val(email);
    $('#address').val(address);
    $('#statSelected').text(id);
    $('html, body').animate({ scrollTop: $('.form-section').offset().top - 20 }, 300);
  }

  function clearFields() {
    $('#cid, #name, #email, #password, #address').val('');
    $('#statSelected').text('—');
  }

  function handleAuthError(err) {
    if (err.status === 401 || err.status === 403) {
      showToast('Session expired. Please login again.', 'error');
      setTimeout(function () { logout(); }, 1500);
    } else {
      showToast('Action failed! Check console.', 'error');
      console.error(err);
    }
  }

  // ✅ FIX: logout clears token and returns to THIS page's login screen
  // instead of redirecting to a separate Login.html
  function logout() {
    localStorage.removeItem('nexus_token');
    $('#adminDashboard').hide();
    $('#admin_username, #admin_password').val('');
    $('#loginBtn').prop('disabled', false).text('Initialize Access');
    $('#loginError').hide();
    $('#loginScreen').show();
  }

  function showToast(msg, type) {
    const $t = $('#toast');
    $t.text(msg).removeClass('success error').addClass(type).show();
    setTimeout(function () { $t.fadeOut(400); }, 3000);
  }
</script>
</body>
</html>
