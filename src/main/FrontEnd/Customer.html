<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Customer Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --accent: #FFAB00;
            --bg: #050505;
            --card-bg: #000;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: white;
            padding: 40px 20px;
        }

        .video-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; object-fit: cover; opacity: 0.15;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3.5rem;
            color: var(--accent);
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .form-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
            border-top: 4px solid var(--accent);
        }

        .form-group { display: flex; flex-direction: column; }

        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 1rem;
            border-radius: 2px;
        }

        input:focus { outline: none; border-color: var(--accent); }

        .button-row {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-save { background: var(--accent); color: #000; }
        .btn-update { background: #2980b9; color: #fff; }
        .btn-delete { background: #c0392b; color: #fff; }
        .btn:hover { filter: brightness(1.2); transform: translateY(-2px); }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0,0,0,0.6);
            margin-top: 20px;
        }

        th {
            background: #111;
            color: var(--accent);
            font-family: 'Bebas Neue';
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid var(--accent);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            font-size: 0.9rem;
        }

        .btn-select {
            background: #333;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 5px 10px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
    <source src="Assests/video.mp4" type="video/mp4">
</video>

<div class="container">
    <h1>Customer Terminal</h1>

    <div class="form-section">
        <div class="form-group">
            <label>Customer ID</label>
            <input type="text" id="cid" placeholder="CUST-001">
        </div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Jason Vercetti">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="jason@nexus.com" style="padding: 12px; background: #111; border: 1px solid #333; color: white;">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" style="padding: 12px; background: #111; border: 1px solid #333; color: white;">
        </div>
        <div class="form-group" style="grid-column: span 2;">
            <label>Address</label>
            <input type="text" id="address" placeholder="123 Ocean View, Vice City">
        </div>

        <div class="button-row">
            <button class="btn btn-save" onclick="savecustomer()">Deploy Customer</button>
            <button class="btn btn-update" onclick="updatecustomer()">Update Data</button>
            <button class="btn btn-delete" onclick="deletecustomer()">Terminate Access</button>
        </div>
        <div class="switch-link" style="text-align: center; margin-top: 15px; font-size: 0.8rem; color: #666;">
            Already a member? <a href="Login.html" style="color: var(--accent); text-decoration: none;">Login Now</a>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Address</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="tablerow"></tbody>
    </table>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    const baseUrl = "http://localhost:8080/api/v1/customer";

    function savecustomer() {
        let customerObj = {
            customer_id: $('#cid').val(),
            name: $('#name').val(),
            email: $('#email').val(),
            password: $('#password').val(),
            address: $('#address').val()
        };

        $.ajax({
            url: baseUrl,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(customerObj),
            success: function (res) {
                alert('Success: Customer Synced with Nexus!');
                clearFields();
                getAll();
                // මචං මේක තමයි ඔයා ඉල්ලපු navigate වෙන කෑල්ල
                window.location.href = 'Game.html';
            },
            error: function (err) {
                alert('Error: Registration Failed!');
                console.log(err);
            }
        });
    }

    function updatecustomer() {
        let customerObj = {
            customer_id: $('#cid').val(),
            name: $('#name').val(),
            email: $('#email').val(),
            password: $('#password').val(),
            address: $('#address').val()
        };

        $.ajax({
            url: baseUrl,
            method: 'PUT',
            contentType: 'application/json',
            data: JSON.stringify(customerObj),
            success: function (res) {
                alert('Customer Intel Updated!');
                clearFields();
                getAll();
            },
            error: function (err) {
                alert('Error: Update Failed!');
            }
        });
    }

    function deletecustomer() {
        let id = $('#cid').val();
        if(!id) { alert("Need ID to terminate!"); return; }

        $.ajax({
            url: baseUrl + '/' + id,
            method: 'DELETE',
            success: function (res) {
                alert('Access Terminated!');
                clearFields();
                getAll();
            },
            error: function (err) {
                alert('Error: Deletion Failed!');
            }
        });
    }

    function getAll() {
        $.ajax({
            url: baseUrl + "/all",
            method: 'GET',
            success: function (res) {
                $('#tablerow').empty();
                res.forEach(c => {
                    const row = `<tr>
                        <td>${c.customer_id}</td>
                        <td>${c.name}</td>
                        <td>${c.email}</td>
                        <td>${c.address}</td>
                        <td><button class="btn-select" onclick="selectCustomer('${c.customer_id}','${c.name}','${c.email}','${c.address}')">SELECT</button></td>
                    </tr>`;
                    $('#tablerow').append(row);
                });
            },
            error: function (err) {
                console.log("Failed to load records.");
            }
        });
    }

    function selectCustomer(id, name, email, address) {
        $('#cid').val(id);
        $('#name').val(name);
        $('#email').val(email);
        $('#address').val(address);
    }

    function clearFields() {
        $('input').val('');
    }

    $(document).ready(function () {
        getAll();
    });
</script>

</body>
</html>
