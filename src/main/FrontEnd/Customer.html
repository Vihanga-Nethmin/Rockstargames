<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Customer Registration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --brand-main: #FFAB00;
            --brand-glow: rgba(255, 171, 0, 0.15);
            --bg: #050505;
            --card-bg: #000000;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Background Video */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.2;
        }

        .customer-container {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Top Accent Line */
        .customer-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--brand-main);
        }

        .customer-container h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--brand-main);
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 1rem;
            border-radius: 2px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-main);
            background: var(--brand-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--brand-main);
            color: #000;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit:active { transform: translateY(0); }

        .footer-note {
            margin-top: 25px;
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
    <source src="Assests/video.mp4" type="video/mp4">
</video>

<div class="customer-container">
    <h1>Join the Nexus</h1>

    <form id="customerForm">
        <div class="form-group">
            <label for="customer_id">Customer ID</label>
            <input type="text" id="customer_id" required placeholder="e.g. CUST_001">
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="e.g. Jason Vercetti">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>

        <button type="button" class="btn-submit" onclick="addCustomer()">Register Customer</button>
    </form>

    <div class="footer-note">
        Rockstar Nexus | Database Integrated
    </div>
</div>

<script>
    async function addCustomer() {
        // Collect data according to your Customer table screenshot
        const customerData = {
            customer_id: document.getElementById('customer_id').value,
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        // Basic validation
        if(!customerData.customer_id || !customerData.name || !customerData.email || !customerData.password) {
            alert("Fill all fields machan!");
            return;
        }

        console.log("Customer Object Ready:", customerData);

        // API Connection (Backend එකට data යවන්න)
        try {
            const response = await fetch('http://localhost:8080/api/v1/customer', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(customerData)
            });

            if(response.ok) {
                alert("Customer " + customerData.name + " added successfully!");
                document.getElementById('customerForm').reset();
            } else {
                alert("Server error! Check if your backend is running.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Failed to connect to server. Check your API URL.");
        }
    }
</script>
</body>
</html>
