<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rockstar Nexus | Digital Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --bg: #050505;
            --card-bg: #0f0f0f;
            --text: #ffffff;
            --accent: #FFAB00;
            --border: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 40px 5%;
        }

        header { text-align: center; margin-bottom: 50px; }

        .back-nav {
            position: absolute;
            top: 20px;
            left: 5%;
            color: var(--accent);
            text-decoration: none;
            font-family: 'Bebas Neue';
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--accent);
            font-size: 4rem; /* Slightly smaller header */
            letter-spacing: 6px;
        }

        .subtitle { color: #555; letter-spacing: 4px; text-transform: uppercase; font-size: 0.8rem; }

        /* --- Updated Grid for Smaller Cards --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Smaller min-width */
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- View Only Card Styles --- */
        .archive-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            position: relative;
            pointer-events: none;
            user-select: none;
            transition: 0.3s;
        }

        .archive-card img {
            width: 100%;
            height: 250px; /* Reduced height from 350px */
            object-fit: cover;
            filter: grayscale(30%);
            opacity: 0.8;
            border-bottom: 2px solid var(--accent);
        }

        .archive-info { padding: 15px; text-align: center; }

        .archive-info h3 {
            font-family: 'Bebas Neue';
            font-size: 1.4rem; /* Reduced from 1.8rem */
            margin-bottom: 5px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .archive-desc {
            font-size: 0.75rem; /* Reduced from 0.85rem */
            color: #666;
            margin-bottom: 10px;
            line-height: 1.3;
            height: 32px;
            overflow: hidden;
        }

        .archive-price {
            color: var(--accent);
            font-weight: 700;
            font-size: 1.1rem; /* Reduced from 1.4rem */
            font-family: 'Bebas Neue';
        }

        .view-only-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.85);
            color: var(--accent);
            padding: 2px 8px;
            font-family: 'Bebas Neue';
            font-size: 0.65rem;
            border: 1px solid var(--accent);
            z-index: 5;
        }

        footer {
            text-align: center;
            padding: 60px 0;
            color: #333;
            letter-spacing: 5px;
            font-size: 0.6rem;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-nav">← RETURN TO MAIN TERMINAL</a>

<header>
    <h1>ARCHIVE GALLERY</h1>
    <p class="subtitle">Digital Exhibition Mode / Read-Only Access</p>
</header>

<section class="gallery-grid" id="archiveGrid"></section>

<footer>
    SYSTEM SECURED | NO TRANSACTIONS PERMITTED IN GALLERY MODE
</footer>

<script>
    const galleryData = [
        { title:"Grand Theft Auto V", desc:"Epic open-world crime adventure set in Los Santos.", price:"Rs 2999.00", img:"Assests/gta v.png" },
        { title:"Red Dead Redemption 2", desc:"Sweeping western epic following outlaw Arthur Morgan.", price:"Rs 3999.00", img:"Assests/rdr 2.png" },
        { title:"GTA Online", desc:"Multiplayer mayhem in the ever-evolving GTA V world.", price:"Rs 1999.00", img:"Assests/gta online.png" },
        { title:"Grand Theft Auto IV", desc:"Niko Bellic's gritty pursuit of the American Dream.", price:"Rs 1999.00", img:"Assests/gta iv.jpg" },
        { title:"GTA: San Andreas", desc:"CJ fights to reclaim his hood across a vast state.", price:"Rs 1499.00", img:"Assests/gta sanAndreas.webp" },
        { title:"Grand Theft Auto: Vice City", desc:"Rise to power in neon-soaked 1980s Miami.", price:"Rs 1299.00", img:"Assests/gta vice city.jpg" },
        { title:"Grand Theft Auto III", desc:"The open-world pioneer that changed gaming forever.", price:"Rs 999.00", img:"Assests/gta 3.jpg" },
        { title:"Red Dead Redemption", desc:"John Marston rides through the dying Wild West.", price:"Rs 2499.00", img:"Assests/rdr1.jpg" },
        { title:"L.A. Noire", desc:"Investigate crime scenes in 1940s Los Angeles.", price:"Rs 1499.00", img:"Assests/La Noire.png" },
        { title:"Bully: Scholarship Edition", desc:"Navigate the social chaos of Bullworth Academy.", price:"Rs 999.00", img:"Assests/bullyScolership.png" },
        { title:"Max Payne 3", desc:"Bullet-time noir shooter in São Paulo's underworld.", price:"Rs 1999.00", img:"Assests/max pain 3.webp" },
        { title:"Max Payne 2", desc:"A film noir love story soaked in slow-motion gunplay.", price:"Rs 999.00", img:"Assests/Maxpain 2.png" },
        { title:"Manhunt", desc:"Brutal stealth horror — survive or be hunted.", price:"Rs 799.00", img:"Assests/manhunt.png" },
        { title:"The Warriors", desc:"Fight your way home across a hostile New York City.", price:"Rs 899.00", img:"Assests/Tha warriors.webp" },
        { title:"Midnight Club: LA", desc:"Underground street racing through a sprawling LA.", price:"Rs 899.00", img:"Assests/Midnight Club-Los_Angeles.jpg" },
        { title:"GTA: Chinatown Wars", desc:"Top-down crime chaos on handheld devices.", price:"Rs 699.00", img:"Assests/ChinatownWars.jpg" },
        { title:"Rockstar Table Tennis", desc:"Surprisingly deep and realistic ping-pong simulation.", price:"Rs 499.00", img:"Assests/rockstartable tennis.jpg" },
        { title:"GTA: Liberty City Stories", desc:"Tony Cipriani's story — a PSP prequel to GTA III.", price:"Rs 899.00", img:"Assests/gta libertycitystories.png" },
        { title:"GTA: Vice City Stories", desc:"Vic Vance's rise in Vice City, before Tommy Vercetti.", price:"Rs 999.00", img:"Assests/gta vice city stories.jpg" },
        { title:"Manhunt 2", desc:"The controversial and banned psychological horror sequel.", price:"Rs 799.00", img:"Assests/Manhunt 2.jpg" }
    ];

    function renderArchive() {
        const grid = document.getElementById('archiveGrid');
        galleryData.forEach(game => {
            const card = document.createElement('div');
            card.className = 'archive-card';
            card.innerHTML = `
                <div class="view-only-tag">ARCHIVE</div>
                <img src="${game.img}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/200x250/111/555?text=Legacy+Asset'">
                <div class="archive-info">
                    <h3>${game.title}</h3>
                    <p class="archive-desc">${game.desc}</p>
                    <p class="archive-price">${game.price}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    window.onload = renderArchive;
</script>

</body>
</html>
