<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Customer Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --brand-main: #FFAB00;
            --brand-glow: rgba(255, 171, 0, 0.15);
            --bg: #050505;
            --card-bg: #000000;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.2;
        }

        .dashboard-container {
            background: rgba(11, 11, 11, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            width: 90%;
            max-width: 1100px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        h1, h2 {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--brand-main);
            margin-bottom: 20px;
            letter-spacing: 2px;
            grid-column: span 2;
            text-align: center;
        }

        h2 { font-size: 2rem; }

        .form-section, .list-section {
            background: var(--card-bg);
            padding: 20px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 1rem;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-main);
            background: var(--brand-glow);
        }

        .btn {
            width: 100%;
            padding: 15px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            cursor: pointer;
            border: none;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-register {
            background: var(--brand-main);
            color: #000;
        }

        .btn-delete {
            background: #c0392b;
            color: #fff;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border: 1px solid #222;
        }

        th {
            background: #111;
            color: #ccc;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        td {
            font-size: 0.9rem;
            color: #aaa;
        }

    </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
    <source src="Assests/video.mp4" type="video/mp4">
</video>

<div class="dashboard-container">
    <h1>Nexus Terminal | Customer History</h1>

    <div class="form-section">
        <h2>Save Order Details</h2>
        <form id="orderDetailForm">
            <div class="form-group">
                <label>Order ID</label>
                <input id="od_oid" type="text" required>
            </div>
            <div class="form-group">
                <label>Customer ID</label>
                <input id="od_cid" type="text" required>
            </div>
            <div class="form-group">
                <label>Order Date</label>
                <input id="od_date" type="text" required>
            </div>
            <div class="form-group">
                <label>Total Amount</label>
                <input id="od_amount" type="text" required>
            </div>
            <button class="btn btn-register" type="submit">Save History</button>
        </form>
    </div>

    <div class="list-section">
        <h2>Order History</h2>
        <div class="form-group">
            <label>Filter by Order ID</label>
            <input id="filter_odid" type="text" placeholder="ORD_001">
        </div>
        <button id="btn_delete_order" class="btn btn-delete">Delete History</button>
        <table id="historyTable">
            <thead>
            <tr>
                <th>Order ID</th>
                <th>Date</th>
                <th>Total</th>
                <th>Customer ID</th>
            </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const baseUrl = "http://localhost:8080/api/v1/orderDetail";

    function clearFields() {
        $('input').val('');
    }

    // 1. Save order_detail data (MATCHES DB columns)
    $("#orderDetailForm").submit(function(e) {
        e.preventDefault();

        let orderDetailObj = {
            order_id: $("#od_oid").val(),
            customer_id: $("#od_cid").val(),
            order_date: $("#od_date").val(),
            total_amount: $("#od_amount").val()
        };

        $.ajax({
            url: baseUrl,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(orderDetailObj),
            success: function (res) {
                alert('History Recorded, Machan!');
                clearFields();
                getAll();
            },
            error: function (err) {
                alert('Error connecting to backend!');
                console.log(err);
            }
        });
    });

    // 2. Fetch all history
    function getAll() {
        $.ajax({
            url: baseUrl + "/all",
            method: 'GET',
            success: function (res) {
                $('#historyBody').empty();
                res.forEach(od => {
                    const row = `<tr>
                        <td>${od.order_id}</td>
                        <td>${od.order_date}</td>
                        <td>${od.total_amount}</td>
                        <td>${od.customer_id}</td>
                    </tr>`;
                    $('#historyBody').append(row);
                });
            },
            error: function (err) {
                console.log("Failed to load history.");
            }
        });
    }

    // 3. Delete order_detail data
    $("#btn_delete_order").click(function() {
        let id = $("#filter_odid").val();
        if(!id) { alert("Type an Order ID to delete!"); return; }

        $.ajax({
            url: baseUrl + '/' + id,
            method: 'DELETE',
            success: function (res) {
                alert('History Deleted!');
                clearFields();
                getAll();
            },
            error: function (err) {
                alert('Error deleting history!');
            }
        });
    });

    $(document).ready(function () {
        getAll();
    });
</script>
</body>
</html>
