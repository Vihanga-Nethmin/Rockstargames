<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Payment</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700&display=swap');

        :root {
            --accent: #FFAB00;
            --bg: #050505;
            --border: #222;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-card {
            background: #000;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border: 1px solid var(--border);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-pay {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h1>Payment Details</h1>
    <form id="paymentForm">
        <input type="hidden" id="selected_game_id" value="G-001">
        <input type="hidden" id="order_price" value="Rs 2500.00">

        <div class="form-group">
            <label>Order ID</label>
            <input type="text" id="order_id" placeholder="ORD-XXXX" required>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="payment_method">
                <option value="Credit Card">Credit Card</option>
                <option value="PayPal">PayPal</option>
                <option value="Crypto">Crypto</option>
            </select>
        </div>
        <button type="button" class="btn-pay" onclick="executeTransaction()">Confirm Payment</button>
    </form>
</div>

<script>
    async function executeTransaction() {
        // Form එකේ තියෙන data ටික ගන්නවා
        const orderId = $('#order_id').val();

        if(!orderId) {
            alert("Please enter an Order ID!");
            return;
        }

        const orderData = {
            order_id: orderId,
            game_id: $('#selected_game_id').val(),
            price: $('#order_price').val()
        };

        const paymentData = {
            payment_id: 'PAY-' + Math.floor(Math.random() * 10000),
            order_id: orderId,
            payment_date: new Date().toISOString().split('T')[0],
            payment_method: $('#payment_method').val(),
            payment_status: "COMPLETED",
            transaction_id: 'TXN_' + Math.random().toString(36).substr(2, 9).toUpperCase()
        };

        console.log("Sending Order:", orderData);
        console.log("Sending Payment:", paymentData);

        try {
            // STEP 1: Order එක Save කරනවා
            await $.ajax({
                url: 'http://localhost:8080/api/v1/order',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(orderData)
            });

            // STEP 2: Payment එක Save කරනවා
            await $.ajax({
                url: 'http://localhost:8080/api/v1/payment',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(paymentData)
            });

            alert("SUCCESS! Payment Confirmed. Redirecting...");
            console.log("Redirecting to Dashboard.html...");
            window.location.replace("Dashboard.html");

        } catch (error) {
            console.error("Error:", error);
            alert("Backend Connection Error! Dashboard එකට යන්න බැරි වුණා.");
        }
    }
</script>
</body>
</html>
