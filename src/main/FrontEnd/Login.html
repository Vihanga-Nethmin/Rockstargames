<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --accent: #FFAB00;
            --bg: #050505;
            --card-bg: #000;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .video-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; object-fit: cover; opacity: 0.15;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 4px solid var(--accent);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            color: var(--accent);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 1rem;
            border-radius: 2px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: black;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            cursor: pointer;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-login:hover { filter: brightness(1.2); }

        .switch-link {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #666;
        }

        .switch-link a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
    <source src="Assests/video.mp4" type="video/mp4">
</video>

<div class="login-card">
    <h1>Member Login</h1>
    <form id="loginForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" required placeholder="name@nexus.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPass" required placeholder="••••••••">
        </div>
        <button type="button" class="btn-login" onclick="loginUser()">Access Terminal</button>
    </form>

    <div class="switch-link">
        New to the underground? <a href="Customer.html">Register Here</a>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const baseUrl = "http://localhost:8080/api/v1/customer/all";

    function loginUser() {
        let email = $('#loginEmail').val();
        let pass = $('#loginPass').val();

        if(!email || !pass) {
            alert("Enter credentials, machan!");
            return;
        }

        // Database එකේ ඉන්න ඔක්කොම ලුහුබැඳලා බලනවා (Check all users)
        $.ajax({
            url: baseUrl,
            method: 'GET',
            success: function (users) {
                // Email එකයි Password එකයි දෙකම match වෙන එකෙක් ඉන්නවද බලනවා
                let user = users.find(u => u.email === email && u.password === pass);

                if (user) {
                    alert("Login Successful! Welcome back, " + user.name);
                    // Login වුණාම Game page එකට යනවා
                    window.location.href = 'Game.html';
                } else {
                    alert("Invalid Email or Password! Try again.");
                }
            },
            error: function (err) {
                alert("Server connection failed!");
            }
        });
    }
</script>
</body>
</html>
