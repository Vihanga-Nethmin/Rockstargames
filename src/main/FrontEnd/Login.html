<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rockstar Nexus | Terminal</title>
    <style>
        :root { --accent: #FFAB00; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #000; padding: 40px; border-top: 4px solid var(--accent); width: 350px; text-align: center; }
        .role-selector { display: flex; margin-bottom: 20px; border: 1px solid #333; }
        .role-btn { flex: 1; padding: 10px; cursor: pointer; background: #111; color: #555; border: none; }
        .role-btn.active { background: var(--accent); color: #000; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn-access { width: 100%; padding: 15px; background: var(--accent); border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .error-msg { color: #ff4444; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: var(--accent); margin-bottom: 20px;">ROCKSTAR NEXUS</h2>

    <!-- Role selector is UI-only; actual role comes from the JWT -->
    <div class="role-selector">
        <button class="role-btn active" onclick="setRole('CUSTOMER', this)">CUSTOMER</button>
        <button class="role-btn" onclick="setRole('ADMIN', this)">ADMIN</button>
    </div>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button class="btn-access" onclick="login()">INITIALIZE ACCESS</button>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    // ─── SECURITY UTILITY ────────────────────────────────────────────────────
    // Decode the JWT payload WITHOUT trusting localStorage for role.
    // The role claim is signed by the Spring Boot server — it cannot be faked.
    function getRoleFromToken(token) {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            // Spring Boot usually puts the roles in one of these fields:
            return (payload.role || payload.roles || payload.authorities || '').toString().toUpperCase();
        } catch (e) {
            return '';
        }
    }

    let selectedRole = "CUSTOMER"; // UI hint only — we verify from JWT

    function setRole(role, btn) {
        selectedRole = role;
        $('.role-btn').removeClass('active');
        $(btn).addClass('active');
    }

    function showError(msg) {
        $('#errorMsg').text(msg).show();
    }

    function login() {
        const username = $('#username').val().trim();
        const pass     = $('#pass').val().trim();

        if (!username || !pass) { showError("Please enter username and password."); return; }

        $.ajax({
            url: "http://localhost:8080/api/v1/auth/login",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({ username, password: pass }),
            success: function(res) {
                if (res.statusCode === 200 || res.data) {
                    const token = res.data.accessToken || res.data;

                    // ✅ SECURITY FIX: derive role FROM the JWT, not from the UI button
                    const tokenRole = getRoleFromToken(token);

                    // Reject if the server-side role doesn't match what the user selected
                    // This prevents a CUSTOMER token being used to reach Admin.html
                    if (!tokenRole.includes(selectedRole)) {
                        showError("Access Denied: Your account does not have " + selectedRole + " privileges.");
                        return;
                    }

                    // Store only the token — role is always read from token, never stored separately
                    localStorage.setItem('nexus_token', token);

                    if (tokenRole.includes('ADMIN')) {
                        window.location.href = "Admin.html";
                    } else {
                        window.location.href = "Game.html";
                    }

                } else {
                    showError("Access Denied: " + (res.message || "Invalid credentials"));
                }
            },
            error: function(xhr) {
                if (xhr.status === 401 || xhr.status === 403) {
                    showError("Wrong username or password.");
                } else if (xhr.status === 0) {
                    showError("Cannot reach server. Is Spring Boot running on port 8080?");
                } else {
                    showError("Error " + xhr.status + ": " + (xhr.responseJSON?.message || "Unknown error"));
                }
            }
        });
    }
</script>
</body>
</html>
