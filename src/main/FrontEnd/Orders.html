<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Place Order</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --brand-main: #FFAB00;
            --brand-glow: rgba(255, 171, 0, 0.15);
            --bg: #050505;
            --card-bg: #000000;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Video Background Setup */
        .video-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            object-fit: cover;
            opacity: 0.3;
        }

        .order-container {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            text-align: center;
        }

        .order-container h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--brand-main);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 1rem;
            border-radius: 2px;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--brand-main);
            background: var(--brand-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--brand-main);
            color: #000;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit:active { transform: translateY(0); }
    </style>
</head>
<body>

<video autoplay muted loop class="video-bg">
    <source src="Assests/video.mp4" type="video/mp4">
</video>

<div class="order-container">
    <h1>New Order</h1>

    <form id="orderForm">
        <div class="form-group">
            <label for="order_id">Order ID</label>
            <input type="text" id="order_id" required placeholder="e.g. ORD_001">
        </div>

        <div class="form-group">
            <label for="game_id">Game ID</label>
            <input type="text" id="game_id" required placeholder="e.g. GAME_77">
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input type="text" id="price" required placeholder="Rs 0.00">
        </div>

        <button type="button" class="btn-submit" onclick="addOrder()">Place Order</button>
    </form>
</div>

<script>
    function addOrder() {
        // Collecting data based on your DB schema
        const orderData = {
            order_id: document.getElementById('order_id').value,
            game_id: document.getElementById('game_id').value,
            price: document.getElementById('price').value
        };

        // Basic validation
        if(!orderData.order_id || !orderData.game_id || !orderData.price) {
            alert("Please fill all fields, machan!");
            return;
        }

        // Logic to handle later (Connect to API here)
        console.log("Order Data Ready:", orderData);

        alert("Order " + orderData.order_id + " added successfully!");

        // Clear form
        document.getElementById('orderForm').reset();
    }
</script>
</body>
</html>
