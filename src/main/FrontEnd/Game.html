<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rockstar Nexus | Full Game Collection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #e0e0e0;
            --accent: #FFAB00;
            --border: #2a2a2a;
            --hover-border: #FFAB00;
            --nav-bg: rgba(0, 0, 0, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: var(--nav-bg);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1001;
            backdrop-filter: blur(10px);
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-links a:hover { color: var(--accent); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            padding: 6px 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-logout:hover { background: var(--accent); color: #000; }

        header { text-align: center; margin: 40px 0 40px; }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--accent);
            font-size: 4.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 171, 0, 0.3);
        }

        .subtitle { color: #666; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; margin-top: 5px; }

        .container { padding: 0 20px 50px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--hover-border);
            box-shadow: 0 15px 35px rgba(255, 171, 0, 0.15);
        }

        .game-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 3px solid var(--accent);
            transition: 0.5s;
        }

        .game-card:hover img { filter: brightness(1.1); }

        .game-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; text-align: center; }
        .game-info h3 { font-size: 1.2rem; margin-bottom: 8px; color: #fff; font-weight: 700; height: 45px; overflow: hidden; }
        .description { font-size: 0.8rem; color: #888; margin-bottom: 15px; line-height: 1.4; height: 35px; overflow: hidden; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.3rem; margin-bottom: 15px; }

        .btn-buy {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            font-family: 'Bebas Neue';
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .btn-buy.owned {
            background: #1a1a1a;
            color: #4CAF50;
            border: 1px solid #4CAF50;
            cursor: default;
        }

        .btn-buy:hover:not(.owned) { background: #fff; }

        /* ── Download Toast ── */
        #downloadToast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111;
            border: 1px solid var(--accent);
            color: #fff;
            font-family: 'Barlow', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 16px 22px;
            z-index: 9999;
            display: none;
            border-radius: 3px;
            box-shadow: 0 8px 30px rgba(255,171,0,0.25);
            max-width: 320px;
        }

        #downloadToast .toast-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 1px;
            display: block;
            margin-bottom: 4px;
        }

        #downloadToast .toast-file {
            color: #ccc;
            font-size: 0.85rem;
            word-break: break-all;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: #000;
            border: 1px solid var(--accent);
            padding: 30px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: var(--accent); font-size: 1.8rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 12px; background: #111;
            border: 1px solid #333; color: white; border-radius: 2px;
        }
        input[readonly] { color: var(--accent); border-color: #222; cursor: not-allowed; }

        .btn-pay {
            width: 100%; padding: 15px; background: var(--accent);
            color: #000; border: none; font-family: 'Bebas Neue';
            font-size: 1.6rem; cursor: pointer; margin-top: 10px;
        }

        .btn-pay:hover { background: #fff; }

        .success-msg {
            background: #1a3a1a;
            border: 1px solid #4CAF50;
            color: #4CAF50;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            font-family: 'Bebas Neue';
            font-size: 1.1rem;
            display: none;
        }

        .error-msg {
            background: #3a1a1a;
            border: 1px solid #f44336;
            color: #f44336;
            padding: 12px;
            margin-top: 10px;
            text-align: center;
            display: none;
            font-size: 0.85rem;
        }

        .download-hint {
            color: #555;
            font-size: 0.72rem;
            text-align: center;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">RS-NEXUS</a>
    <div class="nav-links">
        <a href="landing.html">Home</a>
        <a href="Gallery.html">Gallery</a>
        <a href="Community.html">Community</a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<header>
    <h1>Rockstar Nexus</h1>
    <p class="subtitle">Complete Legendary Collection</p>
</header>

<div class="container">
    <section class="gallery" id="gallery"></section>
</div>

<!-- Payment Modal -->
<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="font-family:'Bebas Neue';color:var(--accent);text-align:center;margin-bottom:25px;font-size:2rem;">Checkout Terminal</h2>

        <div class="form-group">
            <label>Reference Order ID</label>
            <input type="text" id="order_id" readonly>
        </div>
        <div class="form-group">
            <label>Selected Title</label>
            <input type="text" id="disp_title" readonly>
            <input type="hidden" id="hidden_game_id">
            <input type="hidden" id="hidden_game_price">
            <input type="hidden" id="hidden_image_url">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="text" id="disp_price" readonly>
        </div>
        <div class="form-group">
            <label>Payment Gateway</label>
            <select id="payment_method">
                <option value="Credit Card">Visa / Master Card</option>
                <option value="PayPal">PayPal</option>
                <option value="Crypto">Crypto (BTC/ETH)</option>
            </select>
        </div>
        <button class="btn-pay" onclick="processPayment()">Confirm Transaction</button>
        <p class="download-hint">⬇ Your game .zip will auto-download after payment</p>
        <div class="success-msg" id="successMsg"></div>
        <div class="error-msg"   id="errorMsg"></div>
    </div>
</div>

<!-- Download Toast -->
<div id="downloadToast">
    <span class="toast-title">📦 Download Started</span>
    <span class="toast-file" id="toastFileName"></span>
</div>

<!-- JSZip — generates the .zip entirely in the browser, no server needed -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    // ─── API ENDPOINTS ────────────────────────────────────────────────────────
    const API_ORDER     = "http://localhost:8080/api/v1/order";
    const API_PAYMENT   = "http://localhost:8080/api/v1/payment";
    const API_USER_GAME = "http://localhost:8080/api/v1/user-game";

    // ─── JWT UTILITIES ────────────────────────────────────────────────────────
    function getTokenPayload() {
        try {
            const token = localStorage.getItem('nexus_token');
            if (!token) return null;
            return JSON.parse(atob(token.split('.')[1]));
        } catch (e) { return null; }
    }

    function getRoleFromToken() {
        const p = getTokenPayload();
        if (!p) return '';
        return (p.role || p.roles || p.authorities || '').toString().toUpperCase();
    }

    function getCustomerFromToken() {
        const p = getTokenPayload();
        if (!p) return null;
        return p.sub || p.username || null;
    }

    $.ajaxSetup({
        beforeSend: function(xhr) {
            const token = localStorage.getItem('nexus_token');
            if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        }
    });

    // ─── PAGE INIT ────────────────────────────────────────────────────────────
    $(document).ready(function() {
        const token = localStorage.getItem('nexus_token');
        if (!token || !getRoleFromToken().includes('CUSTOMER')) {
            alert("Unauthorized Access. Customers only.");
            window.location.href = 'Login.html';
            return;
        }
        renderGames();
        markOwnedGames();
    });

    // ─── GAME CATALOGUE ───────────────────────────────────────────────────────
    const rockstarGames = [
        { game_id:"1",  title:"Grand Theft Auto V",          description:"Epic open-world crime adventure set in Los Santos.",        price:"Rs 2999.00", imageUrl:"Assests/gta v.png" },
        { game_id:"2",  title:"Red Dead Redemption 2",        description:"Sweeping western epic following outlaw Arthur Morgan.",      price:"Rs 3999.00", imageUrl:"Assests/rdr 2.png" },
        { game_id:"3",  title:"GTA Online",                   description:"Multiplayer mayhem in the ever-evolving GTA V world.",      price:"Rs 1999.00", imageUrl:"Assests/gta online.png" },
        { game_id:"4",  title:"Grand Theft Auto IV",          description:"Niko Bellic's gritty pursuit of the American Dream.",       price:"Rs 1999.00", imageUrl:"Assests/gta iv.jpg" },
        { game_id:"5",  title:"GTA: San Andreas",             description:"CJ fights to reclaim his hood across a vast state.",        price:"Rs 1499.00", imageUrl:"Assests/gta sanAndreas.webp" },
        { game_id:"6",  title:"Grand Theft Auto: Vice City",  description:"Rise to power in neon-soaked 1980s Miami.",                price:"Rs 1299.00", imageUrl:"Assests/gta vice city.jpg" },
        { game_id:"7",  title:"Grand Theft Auto III",         description:"The open-world pioneer that changed gaming forever.",       price:"Rs 999.00",  imageUrl:"Assests/gta 3.jpg" },
        { game_id:"8",  title:"Red Dead Redemption",          description:"John Marston rides through the dying Wild West.",           price:"Rs 2499.00", imageUrl:"Assests/rdr1.jpg" },
        { game_id:"9",  title:"L.A. Noire",                   description:"Investigate crime scenes in 1940s Los Angeles.",           price:"Rs 1499.00", imageUrl:"Assests/La Noire.png" },
        { game_id:"10", title:"Bully: Scholarship Edition",   description:"Navigate the social chaos of Bullworth Academy.",          price:"Rs 999.00",  imageUrl:"Assests/bullyScolership.png" },
        { game_id:"11", title:"Max Payne 3",                  description:"Bullet-time noir shooter in São Paulo's underworld.",      price:"Rs 1999.00", imageUrl:"Assests/max pain 3.webp" },
        { game_id:"12", title:"Max Payne 2",                  description:"A film noir love story soaked in slow-motion gunplay.",    price:"Rs 999.00",  imageUrl:"Assests/Maxpain 2.png" },
        { game_id:"13", title:"Manhunt",                      description:"Brutal stealth horror — survive or be hunted.",            price:"Rs 799.00",  imageUrl:"Assests/manhunt.png" },
        { game_id:"14", title:"The Warriors",                 description:"Fight your way home across a hostile New York City.",      price:"Rs 899.00",  imageUrl:"Assests/Tha warriors.webp" },
        { game_id:"15", title:"Midnight Club: Los Angeles",   description:"Underground street racing through a sprawling LA.",        price:"Rs 899.00",  imageUrl:"Assests/Midnight Club-Los_Angeles.jpg" },
        { game_id:"16", title:"GTA: Chinatown Wars",          description:"Top-down crime chaos on handheld devices.",               price:"Rs 699.00",  imageUrl:"Assests/ChinatownWars.jpg" },
        { game_id:"17", title:"Rockstar Games: Table Tennis", description:"Surprisingly deep and realistic ping-pong simulation.",   price:"Rs 499.00",  imageUrl:"Assests/rockstartable tennis.jpg" },
        { game_id:"18", title:"GTA: Liberty City Stories",   description:"Tony Cipriani's story — a PSP prequel to GTA III.",       price:"Rs 899.00",  imageUrl:"Assests/gta libertycitystories.png" },
        { game_id:"19", title:"GTA: Vice City Stories",       description:"Vic Vance's rise in Vice City, before Tommy Vercetti.",   price:"Rs 999.00",  imageUrl:"Assests/gta vice city stories.jpg" },
        { game_id:"20", title:"Manhunt 2",                    description:"The controversial and banned psychological horror sequel.", price:"Rs 799.00", imageUrl:"Assests/Manhunt 2.jpg" }
    ];

    let ownedGameIds = new Set();

    function renderGames() {
        const gallery = $("#gallery");
        gallery.empty();
        rockstarGames.forEach(game => {
            gallery.append(`
                <div class="game-card" id="card-${game.game_id}">
                    <img src="${game.imageUrl}" alt="${game.title}"
                         onerror="this.src='https://via.placeholder.com/280x350/111/555?text=Nexus+Asset'">
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <p class="description">${game.description}</p>
                        <p class="price">${game.price}</p>
                        <button class="btn-buy" id="btn-${game.game_id}"
                            onclick="openCheckout('${game.game_id}', '${game.title}', '${game.price}', '${game.imageUrl}')">
                            Purchase
                        </button>
                    </div>
                </div>
            `);
        });
    }

    // ─── MARK OWNED GAMES ─────────────────────────────────────────────────────
    function markOwnedGames() {
        const username = getCustomerFromToken();
        if (!username) return;
        $.ajax({
            url: API_USER_GAME + "/my-library",
            method: "GET",
            data: { username: username },
            success: function(res) {
                if (res.data && Array.isArray(res.data)) {
                    res.data.forEach(function(item) {
                        ownedGameIds.add(item.gameId);
                        markBtnOwned(item.gameId);
                    });
                }
            },
            error: function(err) {
                console.warn("Could not load owned games:", err.status);
            }
        });
    }

    function markBtnOwned(gameId) {
        const btn = $("#btn-" + gameId);
        btn.text("✔ OWNED").addClass("owned").attr("onclick", "");
    }

    // ─── CHECKOUT ─────────────────────────────────────────────────────────────
    function openCheckout(id, title, price, imageUrl) {
        if (ownedGameIds.has(id)) return;
        $("#order_id").val("ORD-" + Math.floor(10000 + Math.random() * 90000));
        $("#hidden_game_id").val(id);
        $("#hidden_game_price").val(price);
        $("#hidden_image_url").val(imageUrl);
        $("#disp_title").val(title);
        $("#disp_price").val(price);
        $("#successMsg").hide();
        $("#errorMsg").hide();
        $("#paymentModal").css("display", "flex");
    }

    function closeModal() { $("#paymentModal").hide(); }

    // ─── DOWNLOAD GAME AS .ZIP ────────────────────────────────────────────────
    // Uses JSZip to generate an empty .zip named after the purchased game.
    // File name format: Grand_Theft_Auto_V.zip
    async function downloadGameZip(gameTitle) {
        // Sanitize: remove characters not safe for filenames, collapse spaces
        const safeName = gameTitle
            .replace(/[\/\\:*?"<>|]/g, '')   // strip illegal filename chars
            .replace(/\s+/g, '_');            // spaces → underscores

        const fileName = safeName + ".zip";

        // Build the zip (empty — just a correctly named game file)
        const zip  = new JSZip();
        const blob = await zip.generateAsync({ type: "blob" });

        // Trigger browser download
        const url = URL.createObjectURL(blob);
        const a   = document.createElement('a');
        a.href        = url;
        a.download    = fileName;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        // Show bottom-right toast
        $("#toastFileName").text(fileName);
        $("#downloadToast").fadeIn(350);
        setTimeout(() => $("#downloadToast").fadeOut(600), 4500);
    }

    // ─── PROCESS PAYMENT + RECORD + DOWNLOAD ─────────────────────────────────
    async function processPayment() {
        const orderId    = $("#order_id").val();
        const customerId = getCustomerFromToken();

        $("#successMsg").hide();
        $("#errorMsg").hide();

        const gameId    = $("#hidden_game_id").val();
        const gameTitle = $("#disp_title").val();
        const gamePrice = $("#hidden_game_price").val();
        const imageUrl  = $("#hidden_image_url").val();

        const orderObj = {
            order_id:    orderId,
            game_id:     gameId,
            customer_id: customerId,
            price:       gamePrice
        };

        const paymentObj = {
            payment_id:     "PAY-" + Math.floor(10000 + Math.random() * 90000),
            order_id:       orderId,
            payment_date:   new Date().toISOString().split('T')[0],
            payment_method: $("#payment_method").val(),
            payment_status: "Completed",
            transaction_id: "TXN-" + Math.random().toString(36).substr(2, 9).toUpperCase()
        };

        const userGameObj = {
            username:      customerId,
            gameId:        gameId,
            gameTitle:     gameTitle,
            gamePrice:     gamePrice,
            imageUrl:      imageUrl,
            purchasedDate: new Date().toISOString().split('T')[0]
        };

        try {
            // Step 1 — create order record
            await $.ajax({
                url: API_ORDER,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(orderObj)
            });

            // Step 2 — create payment record
            await $.ajax({
                url: API_PAYMENT,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(paymentObj)
            });

            // Step 3 — record in user's library
            await $.ajax({
                url: API_USER_GAME,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(userGameObj)
            });

            // Step 4 — mark card as owned in UI
            ownedGameIds.add(gameId);
            markBtnOwned(gameId);

            // Step 5 — success message
            $("#successMsg")
                .html("✔ SUCCESS &nbsp;|&nbsp; TXN: " + paymentObj.transaction_id + "<br><small>Your game is downloading...</small>")
                .show();

            // Step 6 — trigger .zip download named after the game
            await downloadGameZip(gameTitle);

            setTimeout(closeModal, 3500);

        } catch (err) {
            console.error("Payment error:", err);
            if (err.status === 401 || err.status === 403) {
                $("#errorMsg").text("Session expired. Please login again.").show();
                setTimeout(() => { window.location.href = 'Login.html'; }, 2000);
            } else if (err.status === 0) {
                $("#errorMsg").text("Cannot reach server. Is Spring Boot running on port 8080?").show();
            } else {
                $("#errorMsg").text("Error " + err.status + ": " + (err.responseJSON?.message || "Payment failed.")).show();
            }
        }
    }

    // ─── LOGOUT ───────────────────────────────────────────────────────────────
    function logout() {
        localStorage.removeItem('nexus_token');
        window.location.href = 'Login.html';
    }
</script>

</body>
</html>
