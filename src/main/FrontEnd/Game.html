<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rockstar Nexus | Full Game Collection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

        :root {
            --bg: #0a0a0a;
            --card-bg: #141414;
            --text: #e0e0e0;
            --accent: #FFAB00;
            --border: #2a2a2a;
            --hover-border: #FFAB00;
            --nav-bg: rgba(0, 0, 0, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Barlow', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* --- Navigation Bar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background: var(--nav-bg);
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1001;
            backdrop-filter: blur(10px);
        }

        .nav-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: var(--accent);
            text-decoration: none;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 1px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .nav-links a:hover {
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 171, 0, 0.5);
        }

        /* --- Main Content --- */
        header { text-align: center; margin: 40px 0 40px; }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            color: var(--accent);
            font-size: 4.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 171, 0, 0.3);
        }

        .subtitle { color: #666; letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; margin-top: 5px; }

        .container {
            padding: 0 20px 50px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--hover-border);
            box-shadow: 0 15px 35px rgba(255, 171, 0, 0.15);
        }

        .game-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 3px solid var(--accent);
            transition: 0.5s;
        }

        .game-card:hover img { filter: brightness(1.1); }

        .game-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; text-align: center; }
        .game-info h3 { font-size: 1.2rem; margin-bottom: 8px; color: #fff; font-weight: 700; height: 45px; overflow: hidden; }
        .description { font-size: 0.8rem; color: #888; margin-bottom: 15px; line-height: 1.4; height: 35px; overflow: hidden; }
        .price { color: var(--accent); font-weight: 700; font-size: 1.3rem; margin-bottom: 15px; }

        .btn-buy {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            font-family: 'Bebas Neue';
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
            margin-top: auto;
        }

        .btn-buy:hover { background: #fff; }

        /* --- Payment Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: #000;
            border: 1px solid var(--accent);
            padding: 30px;
            width: 90%;
            max-width: 450px;
            position: relative;
        }

        .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; color: var(--accent); font-size: 1.8rem; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        input, select {
            width: 100%; padding: 12px; background: #111;
            border: 1px solid #333; color: white; border-radius: 2px;
        }
        input[readonly] { color: var(--accent); border-color: #222; cursor: not-allowed; }

        .btn-pay {
            width: 100%; padding: 15px; background: var(--accent);
            color: #000; border: none; font-family: 'Bebas Neue';
            font-size: 1.6rem; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo">RS-NEXUS</a>
    <div class="nav-links">
        <a href="landing.html">Home</a>
        <a href="Gallery.html">Gallery</a>
        <a href="Orders.html">My Orders</a>
    </div>
</nav>

<header>
    <h1>Rockstar Nexus</h1>
    <p class="subtitle">Complete Legendary Collection</p>
</header>

<div class="container">
    <section class="gallery" id="gallery"></section>
</div>

<div id="paymentModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="font-family: 'Bebas Neue'; color: var(--accent); text-align: center; margin-bottom: 25px; font-size: 2rem;">Checkout Terminal</h2>

        <div class="form-group">
            <label>Reference Order ID</label>
            <input type="text" id="order_id" readonly>
        </div>
        <div class="form-group">
            <label>Selected Title</label>
            <input type="text" id="disp_title" readonly>
            <input type="hidden" id="hidden_game_id">
        </div>
        <div class="form-group">
            <label>Price</label>
            <input type="text" id="disp_price" readonly>
        </div>
        <div class="form-group">
            <label>Payment Gateway</label>
            <select id="payment_method">
                <option value="Credit Card">Visa / Master Card</option>
                <option value="PayPal">PayPal</option>
                <option value="Crypto">Crypto (BTC/ETH)</option>
            </select>
        </div>
        <button class="btn-pay" onclick="processPayment()">Confirm Transaction</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const API_ORDER = "http://localhost:8080/api/v1/order";
    const API_PAYMENT = "http://localhost:8080/api/v1/payment";

    const rockstarGames = [
        { game_id:"1",  title:"Grand Theft Auto V", description:"Epic open-world crime adventure set in Los Santos.", price:"Rs 2999.00", imageUrl:"Assests/gta v.png" },
        { game_id:"2",  title:"Red Dead Redemption 2", description:"Sweeping western epic following outlaw Arthur Morgan.", price:"Rs 3999.00", imageUrl:"Assests/rdr 2.png" },
        { game_id:"3",  title:"GTA Online", description:"Multiplayer mayhem in the ever-evolving GTA V world.", price:"Rs 1999.00", imageUrl:"Assests/gta online.png" },
        { game_id:"4",  title:"Grand Theft Auto IV", description:"Niko Bellic's gritty pursuit of the American Dream.", price:"Rs 1999.00", imageUrl:"Assests/gta iv.jpg" },
        { game_id:"5",  title:"GTA: San Andreas", description:"CJ fights to reclaim his hood across a vast state.", price:"Rs 1499.00", imageUrl:"Assests/gta sanAndreas.webp" },
        { game_id:"6",  title:"Grand Theft Auto: Vice City", description:"Rise to power in neon-soaked 1980s Miami.", price:"Rs 1299.00", imageUrl:"Assests/gta vice city.jpg" },
        { game_id:"7",  title:"Grand Theft Auto III", description:"The open-world pioneer that changed gaming forever.", price:"Rs 999.00", imageUrl:"Assests/gta 3.jpg" },
        { game_id:"8",  title:"Red Dead Redemption", description:"John Marston rides through the dying Wild West.", price:"Rs 2499.00", imageUrl:"Assests/rdr1.jpg" },
        { game_id:"9",  title:"L.A. Noire", description:"Investigate crime scenes in 1940s Los Angeles.", price:"Rs 1499.00", imageUrl:"Assests/La Noire.png" },
        { game_id:"10", title:"Bully: Scholarship Edition", description:"Navigate the social chaos of Bullworth Academy.", price:"Rs 999.00", imageUrl:"Assests/bullyScolership.png" },
        { game_id:"11", title:"Max Payne 3", description:"Bullet-time noir shooter in São Paulo's underworld.", price:"Rs 1999.00", imageUrl:"Assests/max pain 3.webp" },
        { game_id:"12", title:"Max Payne 2", description:"A film noir love story soaked in slow-motion gunplay.", price:"Rs 999.00", imageUrl:"Assests/Maxpain 2.png" },
        { game_id:"13", title:"Manhunt", description:"Brutal stealth horror — survive or be hunted.", price:"Rs 799.00", imageUrl:"Assests/manhunt.png" },
        { game_id:"14", title:"The Warriors", description:"Fight your way home across a hostile New York City.", price:"Rs 899.00", imageUrl:"Assests/Tha warriors.webp" },
        { game_id:"15", title:"Midnight Club: Los Angeles", description:"Underground street racing through a sprawling LA.", price:"Rs 899.00", imageUrl:"Assests/Midnight Club-Los_Angeles.jpg" },
        { game_id:"16", title:"GTA: Chinatown Wars", description:"Top-down crime chaos on handheld devices.", price:"Rs 699.00", imageUrl:"Assests/ChinatownWars.jpg" },
        { game_id:"17", title:"Rockstar Games: Table Tennis", description:"Surprisingly deep and realistic ping-pong simulation.", price:"Rs 499.00", imageUrl:"Assests/rockstartable tennis.jpg" },
        { game_id:"18", title:"GTA: Liberty City Stories", description:"Tony Cipriani's story — a PSP prequel to GTA III.", price:"Rs 899.00", imageUrl:"Assests/gta libertycitystories.png" },
        { game_id:"19", title:"GTA: Vice City Stories", description:"Vic Vance's rise in Vice City, before Tommy Vercetti.", price:"Rs 999.00", imageUrl:"Assests/gta vice city stories.jpg" },
        { game_id:"20", title:"Manhunt 2", description:"The controversial and banned psychological horror sequel.", price:"Rs 799.00", imageUrl:"Assests/Manhunt 2.jpg" }
    ];

    function renderGames() {
        const gallery = $("#gallery");
        gallery.empty();
        rockstarGames.forEach(game => {
            gallery.append(`
                <div class="game-card">
                    <img src="${game.imageUrl}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/280x350/111/555?text=Nexus+Asset'">
                    <div class="game-info">
                        <h3>${game.title}</h3>
                        <p class="description">${game.description}</p>
                        <p class="price">${game.price}</p>
                        <button class="btn-buy" onclick="openCheckout('${game.game_id}', '${game.title}', '${game.price}')">Purchase</button>
                    </div>
                </div>
            `);
        });
    }

    function openCheckout(id, title, price) {
        $("#order_id").val("ORD-" + Math.floor(10000 + Math.random() * 90000));
        $("#hidden_game_id").val(id);
        $("#disp_title").val(title);
        $("#disp_price").val(price);
        $("#paymentModal").css("display", "flex");
    }

    function closeModal() { $("#paymentModal").hide(); }

    async function processPayment() {
        const orderId = $("#order_id").val();
        const orderObj = { order_id: orderId, game_id: $("#hidden_game_id").val(), price: $("#disp_price").val() };
        const paymentObj = {
            payment_id: "PAY-" + Math.floor(10000 + Math.random() * 90000),
            order_id: orderId,
            payment_date: new Date().toISOString().split('T')[0],
            payment_method: $("#payment_method").val(),
            payment_status: "Completed",
            transaction_id: "TXN-" + Math.random().toString(36).substr(2, 9).toUpperCase()
        };

        try {
            await $.ajax({ url: API_ORDER, method: "POST", contentType: "application/json", data: JSON.stringify(orderObj) });
            await $.ajax({ url: API_PAYMENT, method: "POST", contentType: "application/json", data: JSON.stringify(paymentObj) });
            alert("SUCCESS! Order Recorded.\nTransaction ID: " + paymentObj.transaction_id);
            closeModal();
        } catch (err) {
            alert("Connection Error: Is the Rockstar Backend Server running?");
        }
    }

    $(document).ready(renderGames);
</script>

</body>
</html>
