<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rockstar Nexus | Community</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&display=swap');

    :root {
      --bg:       #0a0a0a;
      --card-bg:  #111111;
      --surface:  #161616;
      --text:     #e0e0e0;
      --accent:   #FFAB00;
      --border:   #2a2a2a;
      --green:    #4CAF50;
      --nav-bg:   rgba(0,0,0,0.95);
      --chat-bg:  #0d0d0d;
      --chat-surface: #141414;
      --chat-border: #1f1f1f;
      --chat-width: 380px;
      --chat-height: 520px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 50px;
      background: var(--nav-bg);
      border-bottom: 2px solid var(--accent);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem; color: var(--accent);
      text-decoration: none; letter-spacing: 2px;
    }
    .nav-links { display: flex; gap: 30px; align-items: center; }
    .nav-links a {
      text-decoration: none; color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.2rem; letter-spacing: 1px;
      transition: 0.3s; text-transform: uppercase;
    }
    .nav-links a:hover,
    .nav-links a.active { color: var(--accent); }
    .btn-logout {
      background: transparent; border: 1px solid var(--accent);
      color: var(--accent); font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem; padding: 6px 16px; cursor: pointer;
      letter-spacing: 1px; transition: 0.3s;
    }
    .btn-logout:hover { background: var(--accent); color: #000; }

    /* ── PAGE HEADER ── */
    .page-header {
      text-align: center; padding: 50px 20px 30px;
      border-bottom: 1px solid var(--border);
    }
    .page-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4rem; letter-spacing: 4px;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(255,171,0,0.25);
    }
    .page-header p { color: #555; letter-spacing: 2px; font-size: 0.9rem; margin-top: 6px; }

    /* ── STATS BAR ── */
    .stats-bar {
      display: flex; justify-content: center; gap: 40px;
      padding: 20px; border-bottom: 1px solid var(--border);
      background: var(--card-bg);
    }
    .stat { text-align: center; }
    .stat .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.2rem; color: var(--accent);
    }
    .stat .lbl { font-size: 0.75rem; color: #555; letter-spacing: 1px; text-transform: uppercase; }

    /* ── LAYOUT ── */
    .community-wrap {
      max-width: 1300px; margin: 0 auto;
      padding: 40px 20px 80px;
    }

    /* ── SECTION LABEL ── */
    .section-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem; letter-spacing: 3px;
      color: var(--accent); margin-bottom: 24px;
      border-left: 4px solid var(--accent); padding-left: 14px;
    }

    /* ── USER CARDS GRID ── */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 28px;
    }

    /* ── SINGLE USER CARD ── */
    .user-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      transition: border-color .3s, box-shadow .3s, transform .3s;
      animation: fadeUp .45s ease both;
    }
    .user-card:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 36px rgba(255,171,0,0.12);
      transform: translateY(-4px);
    }

    .user-card-header {
      display: flex; align-items: center; gap: 16px;
      padding: 20px 22px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .user-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #FFAB00, #ff6b00);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; color: #000; flex-shrink: 0;
      border: 2px solid var(--accent);
    }
    .user-meta { flex: 1; }
    .user-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.25rem; letter-spacing: 1px; color: var(--accent);
    }
    .user-tagline { font-size: 0.75rem; color: #555; margin-top: 2px; }
    .user-badge {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 1px;
      padding: 4px 10px; border-radius: 2px;
      background: rgba(255,171,0,0.12);
      color: var(--accent); border: 1px solid rgba(255,171,0,0.3);
    }

    /* ── GAME LIST INSIDE CARD ── */
    .game-list { padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 12px; }

    .game-row {
      display: flex; align-items: center; gap: 14px;
      background: #0e0e0e;
      border: 1px solid #1e1e1e;
      border-radius: 3px;
      overflow: hidden;
      transition: border-color .25s;
    }
    .game-row:hover { border-color: #333; }

    .game-thumb {
      width: 64px; height: 72px;
      object-fit: cover; flex-shrink: 0;
      border-right: 2px solid var(--accent);
      filter: brightness(0.9);
      transition: filter .25s;
    }
    .game-row:hover .game-thumb { filter: brightness(1.1); }

    .game-row-info { flex: 1; padding: 8px 0; }
    .game-row-title {
      font-weight: 700; font-size: 0.88rem; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 200px;
    }
    .game-row-price { color: var(--accent); font-size: 0.78rem; margin-top: 3px; font-weight: 600; }
    .game-row-date  { color: #444; font-size: 0.7rem; margin-top: 2px; }

    .game-owned-badge {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.8rem; letter-spacing: 1px;
      color: var(--green); padding: 0 14px; flex-shrink: 0;
    }

    .show-more-btn {
      width: 100%; padding: 10px;
      background: transparent; border: 1px solid #222;
      color: #555; font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem; letter-spacing: 1px;
      cursor: pointer; transition: 0.2s; margin-top: 4px;
    }
    .show-more-btn:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state {
      text-align: center; padding: 80px 20px;
      color: #333;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 14px; }
    .empty-state p { letter-spacing: 1px; font-size: 0.9rem; }

    .loading-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 80px;
      color: #444; gap: 18px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #1e1e1e;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .loading-wrap span {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 2px; font-size: 1rem; color: #444;
    }

    .you-tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
      padding: 3px 8px; background: rgba(76,175,80,0.15);
      color: var(--green); border: 1px solid rgba(76,175,80,0.3);
      border-radius: 2px; margin-left: 6px; vertical-align: middle;
    }

    /* ═══════════════════════════════════════════════════════
       CHAT WIDGET
    ═══════════════════════════════════════════════════════ */

    /* ── Floating toggle button ── */
    #chat-toggle-btn {
      position: fixed;
      bottom: 32px;
      right: 32px;
      z-index: 999;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(255,171,0,0.45), 0 2px 8px rgba(0,0,0,0.5);
      transition: transform .25s, box-shadow .25s;
    }
    #chat-toggle-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 32px rgba(255,171,0,0.6), 0 2px 8px rgba(0,0,0,0.5);
    }
    #chat-toggle-btn svg { width: 26px; height: 26px; fill: #000; transition: .2s; }
    #chat-toggle-btn.open svg.icon-chat { display: none; }
    #chat-toggle-btn.open svg.icon-close { display: block !important; }
    #chat-toggle-btn svg.icon-close { display: none; }

    /* Notification dot */
    #chat-notif-dot {
      position: absolute; top: 6px; right: 6px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #ff4444;
      border: 2px solid #0a0a0a;
      display: none;
      animation: pulse-dot 1.5s infinite;
    }
    @keyframes pulse-dot {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.3); opacity: .7; }
    }

    /* ── Chat panel ── */
    #chat-panel {
      position: fixed;
      bottom: 106px;
      right: 32px;
      z-index: 998;
      width: var(--chat-width);
      height: var(--chat-height);
      background: var(--chat-bg);
      border: 1px solid var(--accent);
      border-radius: 6px;
      display: flex; flex-direction: column;
      box-shadow: 0 16px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,171,0,0.08);
      transform: translateY(20px) scale(0.97);
      opacity: 0;
      pointer-events: none;
      transition: transform .28s cubic-bezier(.22,1,.36,1), opacity .22s ease;
    }
    #chat-panel.visible {
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: all;
    }

    /* Chat header */
    .chat-header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--chat-surface);
      border-bottom: 1px solid var(--accent);
      border-radius: 6px 6px 0 0;
      flex-shrink: 0;
    }
    .chat-header-icon {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #FFAB00, #ff6b00);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .chat-header-icon svg { width: 18px; height: 18px; fill: #000; }
    .chat-header-info { flex: 1; }
    .chat-header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem; letter-spacing: 2px; color: var(--accent);
      line-height: 1;
    }
    .chat-header-sub {
      font-size: 0.68rem; color: #555; letter-spacing: 1px; margin-top: 2px;
    }
    .chat-online-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(76,175,80,0.7);
      flex-shrink: 0;
    }

    /* Tab bar */
    .chat-tabs {
      display: flex;
      border-bottom: 1px solid var(--chat-border);
      background: var(--chat-surface);
      flex-shrink: 0;
    }
    .chat-tab {
      flex: 1; padding: 9px 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.85rem; letter-spacing: 1.5px;
      color: #444; background: transparent; border: none;
      cursor: pointer; transition: .2s;
      border-bottom: 2px solid transparent;
    }
    .chat-tab:hover { color: #888; }
    .chat-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Messages area ── */
    .chat-messages {
      flex: 1; overflow-y: auto;
      padding: 14px 14px 4px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }

    /* Message bubbles */
    .chat-msg {
      display: flex; gap: 9px; align-items: flex-end;
      animation: msgPop .2s ease both;
    }
    @keyframes msgPop {
      from { opacity:0; transform:translateY(6px) scale(.97); }
      to   { opacity:1; transform:none; }
    }
    .chat-msg.me { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #FFAB00, #ff6b00);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.7rem; color: #000; flex-shrink: 0;
      border: 1px solid rgba(255,171,0,0.4);
    }
    .msg-avatar.other { background: linear-gradient(135deg, #2a2a2a, #1a1a1a); color: #888; border-color: #2a2a2a; }

    .msg-body { max-width: 72%; }
    .msg-sender {
      font-size: 0.63rem; font-weight: 700; letter-spacing: 1px;
      color: #555; margin-bottom: 3px; text-transform: uppercase;
    }
    .chat-msg.me .msg-sender { text-align: right; color: rgba(255,171,0,0.6); }

    .msg-bubble {
      padding: 9px 13px; border-radius: 4px;
      font-size: 0.84rem; line-height: 1.45;
      word-break: break-word;
    }
    .chat-msg.other .msg-bubble {
      background: var(--chat-surface);
      border: 1px solid var(--chat-border);
      color: #ccc;
      border-radius: 4px 4px 4px 0;
    }
    .chat-msg.me .msg-bubble {
      background: rgba(255,171,0,0.12);
      border: 1px solid rgba(255,171,0,0.25);
      color: #fff;
      border-radius: 4px 4px 0 4px;
    }
    .msg-time {
      font-size: 0.6rem; color: #333; margin-top: 4px;
      text-align: right;
    }
    .chat-msg.other .msg-time { text-align: left; }

    /* System / date divider */
    .chat-divider {
      text-align: center; font-size: 0.65rem;
      letter-spacing: 1px; color: #333;
      display: flex; align-items: center; gap: 8px;
      margin: 4px 0;
    }
    .chat-divider::before,.chat-divider::after {
      content: ''; flex: 1; height: 1px; background: #1e1e1e;
    }

    /* Typing indicator */
    .typing-indicator { display: none; }
    .typing-indicator.visible { display: flex; }
    .typing-dots { display: flex; gap: 4px; padding: 10px 14px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #444; animation: typingBounce 1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: .15s; }
    .typing-dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes typingBounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-5px); background: #666; }
    }

    /* ── Online users list (tab 2) ── */
    .chat-users-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: none; flex-direction: column; gap: 2px;
    }
    .chat-users-list.active { display: flex; }
    .chat-messages.active   { display: flex; }

    .online-user-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 3px;
      cursor: pointer; transition: background .2s;
      border: 1px solid transparent;
    }
    .online-user-row:hover {
      background: var(--chat-surface);
      border-color: var(--chat-border);
    }
    .online-user-row .ou-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem; color: #888;
      border: 1px solid #2a2a2a; flex-shrink: 0; position: relative;
    }
    .online-user-row .ou-avatar::after {
      content: ''; position: absolute; bottom: 1px; right: 1px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green); border: 1.5px solid var(--chat-bg);
    }
    .ou-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.95rem; letter-spacing: 1px; color: #bbb;
    }
    .ou-status { font-size: 0.65rem; color: #444; margin-top: 1px; }
    .ou-msg-btn {
      margin-left: auto; padding: 4px 10px;
      background: transparent; border: 1px solid #2a2a2a;
      color: #555; font-family: 'Bebas Neue', sans-serif;
      font-size: 0.75rem; letter-spacing: 1px; cursor: pointer; transition: .2s;
      border-radius: 2px;
    }
    .ou-msg-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Chat input area ── */
    .chat-input-area {
      padding: 10px 12px 12px;
      border-top: 1px solid var(--chat-border);
      background: var(--chat-surface);
      border-radius: 0 0 6px 6px;
      flex-shrink: 0;
    }
    .chat-input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .chat-input-wrap {
      flex: 1; position: relative;
    }
    #chat-input {
      width: 100%; padding: 9px 12px;
      background: var(--chat-bg);
      border: 1px solid var(--chat-border);
      border-radius: 3px; color: #ccc;
      font-family: 'Barlow', sans-serif; font-size: 0.85rem;
      resize: none; outline: none; transition: border-color .2s;
      line-height: 1.4; max-height: 100px;
    }
    #chat-input:focus { border-color: rgba(255,171,0,0.4); }
    #chat-input::placeholder { color: #333; }

    #chat-send-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--accent); border: none; border-radius: 3px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: .2s;
    }
    #chat-send-btn:hover { background: #ffbb20; }
    #chat-send-btn:active { transform: scale(.94); }
    #chat-send-btn svg { width: 18px; height: 18px; fill: #000; }

    .chat-input-meta {
      display: flex; justify-content: space-between;
      align-items: center; margin-top: 6px;
    }
    .chat-room-label {
      font-size: 0.65rem; color: #333; letter-spacing: 1px;
    }
    .chat-char-count { font-size: 0.65rem; color: #2a2a2a; }

    /* ── Emoji picker row ── */
    .emoji-row {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .emoji-btn {
      background: transparent; border: 1px solid #1e1e1e;
      border-radius: 3px; cursor: pointer; padding: 3px 7px;
      font-size: 0.85rem; transition: .15s;
    }
    .emoji-btn:hover { border-color: #3a3a3a; background: #1a1a1a; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes spin   { to { transform: rotate(360deg); } }

    /* Responsive */
    @media (max-width: 480px) {
      :root { --chat-width: calc(100vw - 24px); }
      #chat-panel { right: 12px; bottom: 90px; }
      #chat-toggle-btn { right: 16px; bottom: 20px; }
    }
  </style>
</head>
<body>

<!-- ── NAVIGATION ── -->
<nav>
  <a href="index.html" class="nav-logo">RS-NEXUS</a>
  <div class="nav-links">
    <a href="landing.html">Home</a>
    <a href="Game.html">Store</a>
    <a href="Gallery.html">Gallery</a>
    <a href="Community.html" class="active">Community</a>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- ── PAGE HEADER ── -->
<div class="page-header">
  <h1>🎮 Community Hub</h1>
  <p>See what every Rockstar Nexus player has in their library</p>
</div>

<!-- ── STATS BAR ── -->
<div class="stats-bar">
  <div class="stat">
    <div class="num" id="stat-players">—</div>
    <div class="lbl">Players</div>
  </div>
  <div class="stat">
    <div class="num" id="stat-purchases">—</div>
    <div class="lbl">Total Purchases</div>
  </div>
  <div class="stat">
    <div class="num" id="stat-top-player">—</div>
    <div class="lbl">Top Collector</div>
  </div>
</div>

<!-- ── MAIN CONTENT ── -->
<div class="community-wrap">
  <div class="section-label">Player Libraries</div>
  <div id="community-container">
    <div class="loading-wrap" id="loader">
      <div class="spinner"></div>
      <span>Syncing Community Data...</span>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════
     CHAT WIDGET
═══════════════════════════════════════════════════════ -->

<!-- Floating toggle button -->
<button id="chat-toggle-btn" onclick="toggleChat()" title="Community Chat">
  <div id="chat-notif-dot"></div>
  <!-- Chat icon -->
  <svg class="icon-chat" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 12H6l-2 2V4h16v10zm-9-4h2v2h-2zm0-4h2v2h-2zm-4 4h2v2H7zm0-4h2v2H7zm8 4h2v2h-2zm0-4h2v2h-2z"/>
  </svg>
  <!-- Close icon -->
  <svg class="icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
  </svg>
</button>

<!-- Chat panel -->
<div id="chat-panel">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-icon">
      <svg viewBox="0 0 24 24"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
    </div>
    <div class="chat-header-info">
      <div class="chat-header-title">Community Chat</div>
      <div class="chat-header-sub" id="chat-online-count">Loading players...</div>
    </div>
    <div class="chat-online-dot"></div>
  </div>

  <!-- Tabs -->
  <div class="chat-tabs">
    <button class="chat-tab active" id="tab-global" onclick="switchTab('global')">🌐 Global</button>
    <button class="chat-tab" id="tab-users"  onclick="switchTab('users')">👥 Players</button>
  </div>

  <!-- Messages view (Global tab) -->
  <div class="chat-messages active" id="chat-messages-area">
    <div class="chat-divider">Today</div>
    <!-- messages injected here -->
  </div>

  <!-- Typing indicator -->
  <div class="typing-indicator" id="typing-indicator">
    <div class="msg-avatar other" style="width:28px;height:28px;font-size:.7rem">?</div>
    <div class="msg-bubble" style="background:var(--chat-surface);border:1px solid var(--chat-border);padding:0">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- Online users list (Players tab) -->
  <div class="chat-users-list" id="chat-users-area"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <div class="emoji-row">
      <button class="emoji-btn" onclick="insertEmoji('🎮')">🎮</button>
      <button class="emoji-btn" onclick="insertEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="insertEmoji('💀')">💀</button>
      <button class="emoji-btn" onclick="insertEmoji('🏆')">🏆</button>
      <button class="emoji-btn" onclick="insertEmoji('⚡')">⚡</button>
      <button class="emoji-btn" onclick="insertEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="insertEmoji('👑')">👑</button>
    </div>
    <div class="chat-input-row">
      <div class="chat-input-wrap">
        <textarea id="chat-input" rows="1" maxlength="300"
                  placeholder="Say something to the community..."
                  onkeydown="handleInputKey(event)"
                  oninput="updateCharCount()"></textarea>
      </div>
      <button id="chat-send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="chat-input-meta">
      <span class="chat-room-label"># global-lounge</span>
      <span class="chat-char-count" id="char-count">0/300</span>
    </div>
  </div>
</div>

<!-- ── SCRIPTS ── -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  const API_COMMUNITY = "http://localhost:8080/api/v1/user-game/community";

  /* ─── JWT UTILITIES ─────────────────────────────────────────── */
  function getTokenPayload() {
    try {
      const token = localStorage.getItem('nexus_token');
      if (!token) return null;
      return JSON.parse(atob(token.split('.')[1]));
    } catch (e) { return null; }
  }
  function getRoleFromToken() {
    const p = getTokenPayload();
    if (!p) return '';
    return (p.role || p.roles || p.authorities || '').toString().toUpperCase();
  }
  function getCurrentUsername() {
    const p = getTokenPayload();
    if (!p) return null;
    return p.sub || p.username || null;
  }
  $.ajaxSetup({
    beforeSend: function(xhr) {
      const token = localStorage.getItem('nexus_token');
      if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    }
  });

  /* ─── PAGE GUARD ─────────────────────────────────────────────── */
  $(document).ready(function() {
    const token = localStorage.getItem('nexus_token');
    if (!token || (!getRoleFromToken().includes('CUSTOMER') && !getRoleFromToken().includes('ADMIN'))) {
      alert("Please login first.");
      window.location.href = 'Login.html';
      return;
    }
    loadCommunityFeed();
    initChat();
  });

  /* ─── COMMUNITY FEED ─────────────────────────────────────────── */
  function loadCommunityFeed() {
    const me = getCurrentUsername();
    $.ajax({
      url: API_COMMUNITY,
      method: "GET",
      success: function(res) {
        const container = $("#community-container");
        container.empty();
        const users = Array.isArray(res) ? res : (res.data || []);
        if (!users || users.length === 0) {
          container.html(`<div class="empty-state"><div class="icon">🎮</div>
            <p>No purchases recorded yet.<br>
               Buy a game from the <a href="Game.html" style="color:var(--accent)">Store</a> to appear here!</p>
            <p style="margin-top:14px;font-size:0.75rem;color:#444;">
               If you've already bought games, run the backfill:<br>
               <code style="color:#666">POST /api/v1/backfill/user-games</code>
            </p></div>`);
          updateStats([], "—", 0);
          return;
        }
        const totalPurchases = users.reduce((sum, u) => sum + u.totalGames, 0);
        const topPlayer = users[0]?.username || "—";
        updateStats(users, topPlayer, totalPurchases);
        renderUserCards(users, me);
        updateOnlinePlayers(users);
      },
      error: function(xhr) {
        const container = $("#community-container");
        let msg = "";
        if (xhr.status === 401 || xhr.status === 403) {
          msg = `<div class="empty-state"><div class="icon">🔒</div><p>Session expired. Redirecting to login...</p></div>`;
          setTimeout(() => { window.location.href = 'Login.html'; }, 2000);
        } else if (xhr.status === 0) {
          msg = `<div class="empty-state"><div class="icon">⚠️</div>
            <p>Cannot reach the Spring Boot server on port 8080.<br>Make sure your backend is running.</p></div>`;
        } else if (xhr.status === 404) {
          msg = `<div class="empty-state"><div class="icon">❓</div>
            <p>Endpoint not found (404).<br>Make sure <strong>UserGameController.java</strong> is deployed.</p></div>`;
        } else {
          msg = `<div class="empty-state"><div class="icon">❌</div>
            <p>Error ${xhr.status}: ${xhr.responseJSON?.message || "Could not load community data."}</p></div>`;
        }
        container.html(msg);
      }
    });
  }

  function renderUserCards(users, me) {
    const container = $("#community-container");
    const grid = $('<div class="users-grid"></div>');
    users.forEach(function(user, cardIndex) {
      const isMe     = (user.username === me);
      const initials = user.username.substring(0, 2).toUpperCase();
      const youTag   = isMe ? '<span class="you-tag">YOU</span>' : '';
      const INITIAL_SHOW = 3;
      const games = user.games || [];
      let gamesHTML = '';
      games.forEach(function(game, idx) {
        const hiddenClass = idx >= INITIAL_SHOW ? 'style="display:none" data-extra="true"' : '';
        const dateStr = game.purchasedDate
                ? new Date(game.purchasedDate).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })
                : '';
        gamesHTML += `<div class="game-row" ${hiddenClass}>
          <img class="game-thumb" src="${escHtml(game.imageUrl)}" alt="${escHtml(game.gameTitle)}"
               onerror="this.src='https://via.placeholder.com/64x72/111/555?text=RS'">
          <div class="game-row-info">
            <div class="game-row-title" title="${escHtml(game.gameTitle)}">${escHtml(game.gameTitle)}</div>
            <div class="game-row-price">${escHtml(game.gamePrice)}</div>
            ${dateStr ? `<div class="game-row-date">Purchased: ${dateStr}</div>` : ''}
          </div>
          <div class="game-owned-badge">✔ OWNED</div>
        </div>`;
      });
      const showMoreBtn = games.length > INITIAL_SHOW
              ? `<button class="show-more-btn" onclick="toggleExtra(this)">▼ Show ${games.length - INITIAL_SHOW} More Games</button>` : '';
      const emptyLibrary = games.length === 0
              ? `<p style="color:#333;font-size:0.8rem;text-align:center;padding:12px 0;">No purchases yet</p>` : '';

      const card = $(`<div class="user-card" style="animation-delay:${cardIndex * 0.06}s">
        <div class="user-card-header">
          <div class="user-avatar">${initials}</div>
          <div class="user-meta">
            <div class="user-name">${escHtml(user.username)} ${youTag}</div>
            <div class="user-tagline">${user.totalGames} game${user.totalGames !== 1 ? 's' : ''} in library</div>
          </div>
          <div class="user-badge">LVL ${getLevelFromGames(user.totalGames)}</div>
        </div>
        <div class="game-list">${emptyLibrary}${gamesHTML}${showMoreBtn}</div>
      </div>`);
      grid.append(card);
    });
    container.append(grid);
  }

  /* ─── STATS BAR ──────────────────────────────────────────────── */
  function updateStats(users, topPlayer, totalPurchases) {
    $("#stat-players").text(users.length);
    $("#stat-purchases").text(totalPurchases || 0);
    $("#stat-top-player").text(topPlayer !== "—" ? topPlayer.split('@')[0] : "—");
  }

  /* ─── SHOW MORE / LESS ───────────────────────────────────────── */
  function toggleExtra(btn) {
    const gameList = $(btn).closest('.game-list');
    const extras   = gameList.find('[data-extra="true"]');
    const isShowing = extras.first().is(':visible');
    if (isShowing) {
      extras.hide();
      $(btn).text('▼ Show ' + extras.length + ' More Games');
    } else {
      extras.show();
      $(btn).text('▲ Show Less');
    }
  }

  /* ─── HELPERS ────────────────────────────────────────────────── */
  function getLevelFromGames(count) {
    if (count >= 15) return '★★★';
    if (count >= 8)  return '★★';
    if (count >= 3)  return '★';
    return 'I';
  }
  function escHtml(str) {
    if (!str) return '';
    return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function logout() {
    localStorage.removeItem('nexus_token');
    window.location.href = 'Login.html';
  }

  /* ═══════════════════════════════════════════════════════════════
     CHAT SYSTEM
     ─────────────────────────────────────────────────────────────
     NOTE FOR BACKEND INTEGRATION:
     Replace the localStorage-based mock store with real WebSocket
     (STOMP over SockJS) calls to your Spring Boot backend.
     Endpoints to implement:
       - WS /ws/chat  (STOMP broker)
       - Subscribe: /topic/global
       - Publish:   /app/chat.send  { sender, content, timestamp }
  ═══════════════════════════════════════════════════════════════ */

  const CHAT_STORAGE_KEY = 'nexus_chat_messages';
  const MAX_STORED_MSGS  = 100;
  let chatOpen = false;
  let currentTab = 'global';
  let unreadCount = 0;
  let communityUsers = [];
  let typingTimer = null;

  /* Demo seed messages (shown on first load) */
  const SEED_MESSAGES = [
    { id: 1, sender: 'NightCrawler', content: '🎮 Anyone else finished GTA VI already?', timestamp: Date.now() - 3600000 * 2 },
    { id: 2, sender: 'GhostRider_X', content: 'No way — I just got it. Still on the first act!', timestamp: Date.now() - 3600000 },
    { id: 3, sender: 'V1perQueen',   content: 'The open world is absolutely insane this time around 🔥', timestamp: Date.now() - 1800000 },
    { id: 4, sender: 'NightCrawler', content: 'Agreed. Also — anyone have RDR2 tips for the hunting challenges? 🐻', timestamp: Date.now() - 900000 },
  ];

  function initChat() {
    // Load stored messages or seed with demo data
    let stored = [];
    try { stored = JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '[]'); } catch(e) {}
    if (stored.length === 0) {
      stored = SEED_MESSAGES;
      saveMessages(stored);
    }
    renderAllMessages(stored);
  }

  function saveMessages(msgs) {
    const trimmed = msgs.slice(-MAX_STORED_MSGS);
    try { localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(trimmed)); } catch(e) {}
  }

  function loadMessages() {
    try { return JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '[]'); } catch(e) { return []; }
  }

  function renderAllMessages(msgs) {
    const area = $('#chat-messages-area');
    area.empty();
    // Date divider
    area.append('<div class="chat-divider">Today</div>');
    const me = getCurrentUsername() || 'You';
    msgs.forEach(msg => appendMessageBubble(msg, me, false));
    scrollToBottom();
  }

  function appendMessageBubble(msg, me, animate) {
    const area = $('#chat-messages-area');
    const isMe = (msg.sender === me);
    const initials = msg.sender.substring(0, 2).toUpperCase();
    const timeStr  = new Date(msg.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    const bubble = $(`
      <div class="chat-msg ${isMe ? 'me' : 'other'}">
        <div class="msg-avatar ${isMe ? '' : 'other'}">${initials}</div>
        <div class="msg-body">
          <div class="msg-sender">${escHtml(msg.sender)}</div>
          <div class="msg-bubble">${escHtml(msg.content)}</div>
          <div class="msg-time">${timeStr}</div>
        </div>
      </div>`);

    area.append(bubble);
    if (animate) scrollToBottom();
  }

  function scrollToBottom() {
    const area = document.getElementById('chat-messages-area');
    if (area) area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    const input = $('#chat-input');
    const content = input.val().trim();
    if (!content) return;

    const me = getCurrentUsername() || 'Anonymous';
    const msg = {
      id: Date.now(),
      sender: me,
      content: content,
      timestamp: Date.now()
    };

    // Persist
    const msgs = loadMessages();
    msgs.push(msg);
    saveMessages(msgs);

    // Render
    appendMessageBubble(msg, me, true);

    // Clear input
    input.val('');
    updateCharCount();
    input.css('height', 'auto');

    /* ── TODO: Replace with WebSocket publish ──
       stompClient.send('/app/chat.send', {}, JSON.stringify({
         sender: me, content: content, timestamp: Date.now()
       })); */

    // Simulate a reply occasionally (demo only — remove with real WebSocket)
    simulateDemoReply();
  }

  /* Demo auto-reply — remove once WebSocket backend is connected */
  const DEMO_REPLIERS = ['V1perQueen', 'GhostRider_X', 'NightCrawler', 'IronFoxX'];
  const DEMO_REPLIES  = [
    '🔥 Nice! Which game are you playing?',
    'Same! Can\'t stop grinding 💀',
    'RS Nexus community is the best 🏆',
    'Have you tried the new DLC? ⚡',
    'Let\'s get a session going 🎮',
    'Crazy how good these graphics are 👑'
  ];
  function simulateDemoReply() {
    if (Math.random() > 0.45) return; // ~45% chance of reply
    const delay = 1500 + Math.random() * 2500;
    const replier = DEMO_REPLIERS[Math.floor(Math.random() * DEMO_REPLIERS.length)];

    // Show typing indicator
    setTimeout(() => {
      const ti = $('#typing-indicator');
      ti.addClass('visible');
      ti.find('.msg-avatar').text(replier.substring(0,2).toUpperCase());
    }, delay - 1000);

    setTimeout(() => {
      $('#typing-indicator').removeClass('visible');
      const me = getCurrentUsername() || 'You';
      const reply = {
        id: Date.now(),
        sender: replier,
        content: DEMO_REPLIES[Math.floor(Math.random() * DEMO_REPLIES.length)],
        timestamp: Date.now()
      };
      const msgs = loadMessages();
      msgs.push(reply);
      saveMessages(msgs);
      appendMessageBubble(reply, me, true);

      // If chat is closed, show notif dot
      if (!chatOpen) {
        unreadCount++;
        const dot = document.getElementById('chat-notif-dot');
        dot.style.display = 'block';
      }
    }, delay);
  }

  /* ─── TOGGLE CHAT ──────────────────────────────────────────────── */
  function toggleChat() {
    chatOpen = !chatOpen;
    const panel = document.getElementById('chat-panel');
    const btn   = document.getElementById('chat-toggle-btn');
    panel.classList.toggle('visible', chatOpen);
    btn.classList.toggle('open', chatOpen);

    if (chatOpen) {
      unreadCount = 0;
      document.getElementById('chat-notif-dot').style.display = 'none';
      setTimeout(scrollToBottom, 100);
      document.getElementById('chat-input').focus();
    }
  }

  /* ─── TABS ─────────────────────────────────────────────────────── */
  function switchTab(tab) {
    currentTab = tab;
    $('#tab-global, #tab-users').removeClass('active');
    $(`#tab-${tab}`).addClass('active');

    if (tab === 'global') {
      $('#chat-messages-area').addClass('active').show();
      $('#chat-users-area').removeClass('active').hide();
      $('#chat-input-area, .chat-input-area').show();
    } else {
      $('#chat-messages-area').removeClass('active').hide();
      $('#chat-users-area').addClass('active').show();
      $('.chat-input-area').hide();
    }
  }

  /* ─── ONLINE PLAYERS LIST ──────────────────────────────────────── */
  function updateOnlinePlayers(users) {
    communityUsers = users;
    const me = getCurrentUsername();
    const count = users.length;
    $('#chat-online-count').text(`${count} player${count !== 1 ? 's' : ''} online`);

    const area = $('#chat-users-area');
    area.empty();

    if (users.length === 0) {
      area.append('<p style="color:#333;text-align:center;padding:20px;font-size:.8rem;">No players online</p>');
      return;
    }

    users.forEach(function(user) {
      const initials = user.username.substring(0, 2).toUpperCase();
      const isMe = (user.username === me);
      const row = $(`
        <div class="online-user-row">
          <div class="ou-avatar">${initials}</div>
          <div style="flex:1">
            <div class="ou-name">${escHtml(user.username)}${isMe ? ' <span class="you-tag">YOU</span>' : ''}</div>
            <div class="ou-status">${user.totalGames} game${user.totalGames !== 1 ? 's' : ''} owned</div>
          </div>
          ${!isMe ? `<button class="ou-msg-btn" onclick="mentionUser('${escHtml(user.username)}')">MSG</button>` : ''}
        </div>`);
      area.append(row);
    });
  }

  /* Clicking "MSG" on a player pre-fills @mention and switches to Global */
  function mentionUser(username) {
    switchTab('global');
    const input = document.getElementById('chat-input');
    input.value = `@${username} `;
    input.focus();
    updateCharCount();
  }

  /* ─── INPUT HELPERS ────────────────────────────────────────────── */
  function handleInputKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
    // Auto-grow textarea
    const ta = document.getElementById('chat-input');
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 100) + 'px';
  }

  function updateCharCount() {
    const len = document.getElementById('chat-input').value.length;
    document.getElementById('char-count').textContent = `${len}/300`;
    document.getElementById('char-count').style.color = len > 270 ? '#ff4444' : '#2a2a2a';
  }

  function insertEmoji(emoji) {
    const input = document.getElementById('chat-input');
    const start = input.selectionStart;
    const val   = input.value;
    input.value = val.substring(0, start) + emoji + val.substring(start);
    input.selectionStart = input.selectionEnd = start + emoji.length;
    input.focus();
    updateCharCount();
  }
</script>
</body>
</html>
