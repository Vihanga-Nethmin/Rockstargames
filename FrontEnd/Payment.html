<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rockstar Nexus | Payment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;700&display=swap');

        :root {
            --accent: #FFAB00;
            --bg: #050505;
            --border: #222;
        }

        body {
            font-family: 'Barlow', sans-serif;
            background-color: var(--bg);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-card {
            background: #000;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border: 1px solid var(--border);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #333;
            color: white;
            border-radius: 2px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-pay {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="payment-card">
    <h1>Payment Details</h1>
    <form id="paymentForm">
        <div class="form-group">
            <label>Payment ID</label>
            <input type="text" id="payment_id" required>
        </div>
        <div class="form-group">
            <label>Order ID</label>
            <input type="text" id="order_id" required>
        </div>
        <div class="form-group">
            <label>Transaction ID</label>
            <input type="text" id="transaction_id" required>
        </div>
        <div class="form-group">
            <label>Payment Date</label>
            <input type="date" id="payment_date" required>
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="payment_method">
                <option value="Credit Card">Credit Card</option>
                <option value="PayPal">PayPal</option>
                <option value="Crypto">Crypto</option>
            </select>
        </div>
        <div class="form-group">
            <label>Payment Status</label>
            <select id="payment_status">
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <button type="button" class="btn-pay" onclick="addPayment()">Confirm Payment</button>
    </form>
</div>

<script>
    function addPayment() {
        const paymentData = {
            payment_id: document.getElementById('payment_id').value,
            order_id: document.getElementById('order_id').value,
            payment_date: document.getElementById('payment_date').value,
            payment_method: document.getElementById('payment_method').value,
            payment_status: document.getElementById('payment_status').value,
            transaction_id: document.getElementById('transaction_id').value
        };

        console.log("Payment Ready:", paymentData);
        alert("Payment Data Collected for " + paymentData.payment_id);
        // Manage your backend logic here
    }
</script>
</body>
</html>
