<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockStarGames | Create Account</title>
    <style>
        :root {
            /* Brand Color: Amber/Gold */
            --brand-main: rgba(255, 171, 0, 1);
            /* Requested Highlight Color */
            --brand-glow: rgba(255, 171, 0, 0.15);
            --dark-bg: #0b0b0b;
            --card-bg: #000000;
            --input-bg: #151515;
            --text-gray: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 4px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #222;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--brand-main);
            letter-spacing: -1px;
            text-transform: uppercase;
            margin: 0;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-gray);
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 2px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        /* Using your requested color for the focus state */
        input:focus {
            outline: none;
            border-color: var(--brand-main);
            background-color: var(--brand-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--brand-main);
            color: #000;
            border: none;
            border-radius: 2px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: transform 0.1s;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 25px;
            text-align: center;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 class="logo">RockStarGames</h1>
        <p class="subtitle">Join the community</p>
    </div>

    <form action="/register" method="POST">
        <div class="form-group">
            <label for="customer_id">Customer ID</label>
            <input type="text" id="customer_id" name="customer_id" required placeholder="e.g. USER_12345">
        </div>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required placeholder="John Marston">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@domain.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Register Account</button>
    </form>

    <div class="footer-note">
        By registering, you agree to the RockStarGames Terms of Service.
    </div>
</div>

</body>
</html>
