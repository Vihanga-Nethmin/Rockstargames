<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockStarGames | Sign In</title>
    <style>
        :root {
            --brand-color: rgba(255, 171, 0, 1);
            --brand-bg-glow: rgba(255, 171, 0, 0.15);
            --dark-bg: #0f0f0f;
            --input-bg: #1a1a1a;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signin-card {
            background-color: #000;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 20px var(--brand-bg-glow);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--brand-color);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: var(--input-bg);
            border: 1px solid #333;
            border-radius: 4px;
            color: white;
            outline: none;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input:focus {
            border-color: var(--brand-color);
            background-color: var(--brand-bg-glow);
        }

        .btn-signin {
            width: 100%;
            padding: 14px;
            background-color: var(--brand-color);
            color: black;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.3s;
        }

        .btn-signin:hover {
            opacity: 0.9;
        }

        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #777;
        }

        .footer-links a {
            color: var(--brand-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="signin-card">
    <div class="logo">RockStarGames</div>

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-signin">SIGN IN</button>
    </form>

    <div class="footer-links">
        Don't have an account? <a href="#">Create one</a>
    </div>
</div>

</body>
</html>
